<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Cat Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta property="og:title" content="Whisker Bytes: Cat Café Fun 🐾☕🍪">
<meta property="og:description" content="Choose your cat — Mochi, Ginger, Luna, or Jinx — and serve tips, treats, and cozy chaos in the cutest café ever!">
<meta property="og:url" content="https://maximumreality.github.io/WhiskerBytesCatCafe/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://maximumreality.github.io/WhiskerBytesCatCafe/whiskerbytes.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-touch-callout: none; -webkit-user-select: none;
  user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
html, body { overflow: hidden; width: 100vw; height: 100vh; background: #2c1810; }
canvas { display: block; }
:root {
  --wood: #6d4c3d; --wood-dark: #4a3028;
  --pink: #ffb5c8; --pink-dark: #e8829a; --gold: #d4a843;
  --warm-white: rgba(255,248,230,0.95); --shadow: rgba(60,30,10,0.35);
  --font-main: 'Nunito','Fredoka One',sans-serif;
}
#overlay {
  position: fixed; inset: 0; z-index: 5000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; padding-bottom: 32px;
  background: #4a2c2a url('IMG_2475.jpeg') center/cover no-repeat;
}
#overlay::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(to bottom,rgba(30,10,5,0.2),rgba(30,10,5,0.55));
  pointer-events:none;
}
#overlay.hidden { display: none; }
#logo-header {
  position:absolute; top:0; left:0; width:100%; height:42%;
  background: url('whiskerbytes.png') center/contain no-repeat;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
}
.select-panel {
  position:relative; z-index:6000; background:var(--warm-white);
  border-radius:20px; border:3px solid var(--gold);
  box-shadow:0 8px 32px var(--shadow); padding:16px; width:min(340px,90vw);
}
.select-title {
  font-family:var(--font-main); font-size:13px; font-weight:900;
  letter-spacing:3px; text-transform:uppercase; color:var(--wood-dark);
  text-align:center; margin-bottom:12px;
}
.char-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-select {
  background:white; border:2.5px solid var(--pink); border-radius:14px;
  padding:10px 8px 8px; cursor:pointer; text-align:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}
.btn-select:active { border-color:var(--pink-dark); }
.btn-select img { width:48px; height:48px; display:block; margin:0 auto 4px; }
.btn-select .cat-name {
  font-family:var(--font-main); font-size:11px; font-weight:900;
  text-transform:uppercase; letter-spacing:2px; color:var(--wood-dark);
}
.btn-select .cat-power { font-size:9px; color:#888; }
#hud {
  position:fixed; top:10px; left:10px; display:none; z-index:200;
  background:var(--warm-white); border:2.5px solid var(--wood); border-radius:14px;
  padding:8px 12px; box-shadow:0 4px 12px var(--shadow);
  font-family:var(--font-main); font-size:12px; font-weight:700;
  color:var(--wood-dark); line-height:1.7; min-width:140px;
}
#hud .hud-row { display:flex; align-items:center; gap:6px; }
#hud .hud-val { color:var(--wood-dark); font-weight:900; }
#hud .hud-warn { color:#e05050; font-weight:900; }
#cookBar {
  width:100%; height:6px; background:rgba(0,0,0,0.08);
  border-radius:99px; overflow:hidden; margin-top:4px; display:none;
}
#cookFill {
  height:100%; width:0%;
  background:linear-gradient(90deg,var(--pink),var(--gold));
  border-radius:99px; transition:width 0.05s linear;
}
.home-btn {
  position:fixed; top:12px; right:12px; z-index:2000;
  background:var(--pink); border:2px solid var(--pink-dark); color:var(--wood-dark);
  padding:7px 14px; border-radius:20px; font-family:var(--font-main);
  font-size:11px; font-weight:900; text-decoration:none; letter-spacing:1px;
  box-shadow:0 3px 8px var(--shadow);
}
#day-over {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--warm-white); border:3px solid var(--gold); border-radius:20px;
  padding:28px 32px; box-shadow:0 8px 40px var(--shadow);
  z-index:8000; display:none; text-align:center;
  font-family:var(--font-main); min-width:220px;
}
#day-over .over-title { font-size:22px; font-weight:900; color:var(--wood-dark); margin-bottom:8px; }
#day-over .over-score { font-size:14px; color:#888; margin-bottom:4px; }
#day-over .over-num { font-size:42px; font-weight:900; color:var(--gold); line-height:1; margin-bottom:16px; }
#day-over .over-best { font-size:11px; color:#aaa; margin-bottom:16px; }
.over-btn {
  background:var(--pink); border:2px solid var(--pink-dark); color:var(--wood-dark);
  padding:10px 24px; border-radius:20px; font-family:var(--font-main);
  font-size:12px; font-weight:900; cursor:pointer; box-shadow:0 3px 8px var(--shadow);
}
#controls {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  display:none; flex-direction:column; align-items:center; gap:6px; z-index:1000;
}
.d-pad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:4px; }
.ctrl-btn {
  width:54px; height:54px; border-radius:50%; border:2.5px solid var(--wood);
  background:var(--warm-white); font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px var(--shadow); cursor:pointer;
}
.ctrl-btn:active { transform:scale(0.92); background:var(--pink); }
#action-btn {
  width:160px; height:48px; border-radius:24px; border:2.5px solid var(--pink-dark);
  background:var(--pink); font-family:var(--font-main); font-size:13px; font-weight:900;
  letter-spacing:2px; text-transform:uppercase; color:var(--wood-dark);
  box-shadow:0 3px 8px var(--shadow); cursor:pointer;
}
#action-btn:active { transform:scale(0.95); background:var(--pink-dark); color:white; }
#toast {
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  background:var(--warm-white); border:2px solid var(--gold); border-radius:20px;
  padding:6px 18px; font-family:var(--font-main); font-size:12px; font-weight:700;
  color:var(--wood-dark); box-shadow:0 4px 12px var(--shadow);
  z-index:300; pointer-events:none; opacity:0; transition:opacity 0.2s; white-space:nowrap;
}
#toast.show { opacity:1; }
</style>
</head>
<body>

<a href="https://maximumreality.xyz/" class="home-btn">🏠 Home</a>

<div id="overlay">
  <div id="logo-header"></div>
  <div class="select-panel">
    <div class="select-title">☕ Choose Your Cat ☕</div>
    <div class="char-grid">
      <div class="btn-select" onpointerdown="startGame('mochi')">
        <img src="mochi_idle.png" alt="Mochi">
        <div class="cat-name">Mochi</div><div class="cat-power">⚡ fast cook</div>
      </div>
      <div class="btn-select" onpointerdown="startGame('gingerella')">
        <img src="gingerella_idle.png" alt="Ginger">
        <div class="cat-name">Ginger</div><div class="cat-power">💵 double tips</div>
      </div>
      <div class="btn-select" onpointerdown="startGame('luna')">
        <img src="luna_idle.png" alt="Luna">
        <div class="cat-name">Luna</div><div class="cat-power">💨 speedy</div>
      </div>
      <div class="btn-select" onpointerdown="startGame('jinx')">
        <img src="jinx_idle.png" alt="Jinx">
        <div class="cat-name">Jinx</div><div class="cat-power">⏳ patient crowd</div>
      </div>
    </div>
  </div>
</div>

<div id="hud">
  <div class="hud-row">⭐ <span class="hud-val" id="scoreVal">0</span> &nbsp; 🏆 <span class="hud-val" id="highVal">0</span></div>
  <div class="hud-row">🕒 <span class="hud-val" id="timeVal">9:00 am</span></div>
  <div class="hud-row">🗑️ <span class="hud-val" id="trashVal">0</span>% &nbsp; <span id="holdingTxt">🐾 empty</span></div>
  <div id="cookBar"><div id="cookFill"></div></div>
</div>

<div id="toast"></div>

<div id="day-over">
  <div class="over-title">🎆 Shift Over! 🎆</div>
  <div class="over-score">FINAL SCORE</div>
  <div class="over-num" id="finalScore">0</div>
  <div class="over-best" id="finalBest"></div>
  <button class="over-btn" onclick="location.reload()">🏠 Back to Café</button>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div>
    <button class="ctrl-btn" id="up">⬆️</button>
    <div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
    <div></div><div></div><div></div>
  </div>
  <button id="action-btn" onpointerdown="interact()">🐾 MEOW</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

// These two constants mirror the original exactly
const BG_H   = 160;  // height of background strip
const ITEM_Y = 200;  // y position of all counter items (same as original {y:200})

const catImg = new Image(), bgImg = new Image();
const f1 = new Image(), f2 = new Image(), f3 = new Image();
f1.src='friend1.png'; f2.src='friend2.png'; f3.src='critic.png';

let gameActive=false, score=0, gameMinutes=540;
let playerHolding=null, trashLevel=0;
let tvActive=false, radioActive=false, sparkleAlpha=0;
let floatingTips=[], musicNotes=[], particles=[];
let furniture=[], customers=[];

let highScore = parseInt(localStorage.getItem('whiskerBytesHigh')||'0');
document.getElementById('highVal').textContent = highScore;

const player  = { x:200, y:350, speed:5, cookTime:60, power:'', readyTimer:0, bobTimer:0, facing:'right' };
const kitchen = { active:false, timer:0, maxTimer:0, item:null };
const keys    = { up:false, down:false, left:false, right:false };

['up','down','left','right'].forEach(id => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[id]=true; });
  b.addEventListener('pointerup',  e=>{ e.preventDefault(); keys[id]=false; });
  b.addEventListener('pointerleave',()=>{ keys[id]=false; });
});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'   ||e.key==='w') keys.up=true;
  if(e.key==='ArrowDown' ||e.key==='s') keys.down=true;
  if(e.key==='ArrowLeft' ||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
  if(e.key===' '||e.key==='Enter') interact();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'   ||e.key==='w') keys.up=false;
  if(e.key==='ArrowDown' ||e.key==='s') keys.down=false;
  if(e.key==='ArrowLeft' ||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
});

let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<(count||8);i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
      life:1,decay:0.03+Math.random()*0.03,color,size:4+Math.random()*6});
  }
}

// ── START GAME ──
window.startGame = function(catId) {
  catImg.src=catId+'_idle.png';
  bgImg.src='IMG_2480.jpeg';
  player.power   =catId;
  player.speed   =catId==='luna'  ? 8 : 5;
  player.cookTime=catId==='mochi' ? 35 : 60;
  player.x=canvas.width/2;
  player.y=canvas.height/2;

  // midY formula taken verbatim from original source
  const midY = BG_H + (canvas.height - BG_H - 160) / 2;
  const midX = canvas.width / 2;

  furniture = [
    { x:40,      y:ITEM_Y, type:'WINDOW',  e:'🪟' },
    { x:80,      y:ITEM_Y, type:'STATION', item:'☕', e:'☕', label:'Coffee' },
    { x:160,     y:ITEM_Y, type:'STATION', item:'🍪', e:'🍪', label:'Cookie' },
    { x:240,     y:ITEM_Y, type:'STATION', item:'🍼', e:'🍼', label:'Milk'   },
    { x:320,     y:ITEM_Y, type:'TRASH',   e:'🗑️' },
    { x:50,             y:midY, type:'RADIO', e:'📻' },
    { x:canvas.width-50,y:midY, type:'TV',    e:'📺' },
    { x:midX,           y:midY, type:'TABLE', e:'🟫' },
    { x:midX-65,        y:midY, type:'CHAIR', e:'🪑', occupied:false },
    { x:midX+65,        y:midY, type:'CHAIR', e:'🪑', occupied:false },
  ];

  score=0; gameMinutes=540; trashLevel=0;
  playerHolding=null; kitchen.active=false;
  customers=[]; floatingTips=[]; musicNotes=[]; particles=[];
  tvActive=false; radioActive=false;

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hud').style.display='block';
  document.getElementById('controls').style.display='flex';
  gameActive=true;
};

// ── INTERACT ──
window.interact = function(){
  if(!gameActive) return;
  for(const f of furniture){
    if(Math.hypot(player.x-f.x,player.y-f.y)>72) continue;
    if(f.type==='STATION'&&!playerHolding&&!kitchen.active){
      if(trashLevel>=100){showToast('🗑️ Too messy!');return;}
      kitchen.active=true; kitchen.timer=player.cookTime;
      kitchen.maxTimer=player.cookTime; kitchen.item=f.item;
      document.getElementById('cookBar').style.display='block';
      showToast('Preparing '+f.item+'...'); return;
    }
    if(f.type==='TRASH'&&playerHolding){
      playerHolding=null; trashLevel=Math.min(100,trashLevel+22);
      spawnParticles(f.x,f.y,'#888',6); showToast('🗑️ Tossed!');
      updateHolding(); return;
    }
    if(f.type==='WINDOW'&&trashLevel>=100){
      trashLevel=0; spawnParticles(f.x,f.y,'#a8e6cf',12);
      showToast('✨ Cleaned up!'); return;
    }
    if(f.type==='TV'){tvActive=!tvActive;showToast(tvActive?'📺 TV on!':'📺 TV off');return;}
    if(f.type==='RADIO'){radioActive=!radioActive;showToast(radioActive?'📻 Music on!':'📻 Music off');return;}
  }
  for(const c of customers){
    if(Math.hypot(player.x-c.x,player.y-c.y)>82) continue;
    if(playerHolding!==c.order) continue;
    const base=player.power==='gingerella'?100:50;
    const bonus=c.isCritic?150:0;
    const speed=(c.patience/c.maxPatience)>0.7?20:0;
    const total=base+bonus+speed;
    score+=total;
    if(score>highScore){highScore=score;localStorage.setItem('whiskerBytesHigh',highScore);}
    floatingTips.push({x:c.x,y:c.y-30,text:'💵 +'+total,life:70,maxLife:70});
    spawnParticles(c.x,c.y,'#ffd700',12);
    if(speed>0) showToast('⚡ Speed bonus! +'+speed);
    c.chair.occupied=false;
    customers=customers.filter(cu=>cu!==c);
    playerHolding=null; updateHolding(); return;
  }
};

function updateHolding(){
  const el=document.getElementById('holdingTxt');
  el.textContent=playerHolding?'🐾 '+playerHolding:'🐾 empty';
  el.style.color=playerHolding?'#8b4513':'#bbb';
}

// ── UPDATE ──
function update(){
  if(!gameActive) return;
  if(!kitchen.active){
    let dx=0,dy=0;
    if(keys.up)    dy-=1;
    if(keys.down)  dy+=1;
    if(keys.left)  dx-=1;
    if(keys.right) dx+=1;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    player.x+=dx*player.speed; player.y+=dy*player.speed;
    if(dx) player.facing=dx>0?'right':'left';
    if(dx||dy) player.bobTimer+=0.2;
  } else {
    kitchen.timer--;
    if(kitchen.timer<=0){
      kitchen.active=false; playerHolding=kitchen.item; player.readyTimer=45;
      document.getElementById('cookBar').style.display='none';
      spawnParticles(player.x,player.y-40,'#ffb5c8',10);
      showToast(kitchen.item+' Ready!'); updateHolding();
    }
  }

  // Clamp — original used Math.max(225,...) so player stays off the very top
  // We use 220 so player can just reach the y=200 counter items
  player.x=Math.max(40,   Math.min(canvas.width -40,  player.x));
  player.y=Math.max(220,  Math.min(canvas.height-210, player.y));

  if(player.readyTimer>0) player.readyTimer--;

  gameMinutes+=0.15;
  if(gameMinutes>=1260){endDay();return;}

  if(Math.random()<0.007){
    const chair=furniture.find(f=>f.type==='CHAIR'&&!f.occupied);
    if(chair){
      chair.occupied=true;
      const isC=Math.random()<0.12;
      const pat=(player.power==='jinx'?1500:1100)+Math.random()*200;
      customers.push({x:chair.x,y:chair.y,chair,
        order:isC?'🍪':['☕','🍪','🍼'][Math.floor(Math.random()*3)],
        isCritic:isC, img:isC?f3:(Math.random()>0.5?f1:f2),
        patience:pat, maxPatience:pat, arrivalScale:0.1});
    }
  }

  customers.forEach((c,i)=>{
    if(c.arrivalScale<1) c.arrivalScale=Math.min(1,c.arrivalScale+0.06);
    c.patience--;
    if(c.patience<=0){
      c.chair.occupied=false; customers.splice(i,1);
      score=Math.max(0,score-50); showToast('😾 Customer left! -50');
      spawnParticles(c.x,c.y,'#ff6666',8);
    }
  });

  if(trashLevel>=100) sparkleAlpha=(Math.sin(Date.now()/100)+1)/2;
  if(radioActive&&Math.random()<0.04)
    musicNotes.push({x:58,y:BG_H+140,vx:(Math.random()-0.5)*1.2,vy:-(0.6+Math.random()*0.8),life:1,decay:0.015});
  musicNotes.forEach((n,i)=>{n.x+=n.vx;n.y+=n.vy;n.life-=n.decay;if(n.life<=0)musicNotes.splice(i,1);});
  floatingTips.forEach((t,i)=>{t.y-=1.2;t.life--;if(t.life<=0)floatingTips.splice(i,1);});
  particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.vx*=0.95;p.vy*=0.95;p.life-=p.decay;if(p.life<=0)particles.splice(i,1);});

  // HUD
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('highVal').textContent=highScore;
  const trashEl=document.getElementById('trashVal');
  trashEl.textContent=trashLevel;
  trashEl.className=trashLevel>=75?'hud-warn':'hud-val';
  const h=Math.floor(gameMinutes/60),m=Math.floor(gameMinutes%60);
  document.getElementById('timeVal').textContent=(h%12||12)+':'+(m<10?'0':'')+m+(h>=12?'pm':'am');
  if(kitchen.active)
    document.getElementById('cookFill').style.width=((kitchen.maxTimer-kitchen.timer)/kitchen.maxTimer*100)+'%';
  updateHolding();
}

function endDay(){
  gameActive=false;
  document.getElementById('finalScore').textContent=score;
  const best=parseInt(localStorage.getItem('whiskerBytesHigh')||'0');
  const isNew=score>=best;
  if(isNew) localStorage.setItem('whiskerBytesHigh',score);
  document.getElementById('finalBest').textContent=isNew?'🏆 New Best Score!':'Best: '+best;
  document.getElementById('day-over').style.display='block';
}

// ── DRAW ──
// Draw order mirrors the original exactly:
// 1. bg image  2. floor tiles  3. furniture (shelf then emoji)  4. customers  5. player  6. effects
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 1. Background strip — original: ctx.drawImage(bgImg,0,0,canvas.width,160)
  if(bgImg.complete&&bgImg.naturalWidth>0)
    ctx.drawImage(bgImg,0,0,canvas.width,BG_H);
  else { ctx.fillStyle='#3d1a0e'; ctx.fillRect(0,0,canvas.width,BG_H); }

  // 2. Floor tiles — original started at y=160
  const ts=60;
  for(let x=0;x<canvas.width;x+=ts){
    for(let y=BG_H;y<canvas.height;y+=ts){
      ctx.fillStyle=(Math.floor(x/ts)+Math.floor(y/ts))%2===0?'#e8c99a':'#d4b080';
      ctx.fillRect(x,y,ts,ts);
    }
  }
  // Subtle grout
  ctx.strokeStyle='rgba(160,110,60,0.15)'; ctx.lineWidth=1;
  for(let x=0;x<=canvas.width;x+=ts){ctx.beginPath();ctx.moveTo(x,BG_H);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=BG_H;y<=canvas.height;y+=ts){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}

  // 3. Furniture
  // Original drew shelf THEN emoji for STATION — we keep that same order
  furniture.forEach(f=>{
    // Shelf bar below station items (original: ctx.fillRect(f.x-40, f.y+20, 80, 15))
    if(f.type==='STATION'){
      ctx.fillStyle='#5d4037';
      ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=5; ctx.shadowOffsetY=3;
      ctx.fillRect(f.x-40, f.y+20, 80, 15);
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    }

    // Emoji rendering — exactly as original
    if(f.type==='TV'&&tvActive){
      ctx.shadowBlur=15; ctx.shadowColor='yellow';
      ctx.fillStyle='black'; ctx.fillRect(f.x-25,f.y-20,50,40);
      ctx.shadowBlur=0;
      ctx.font='20px Arial'; ctx.fillText('🐱',f.x-11,f.y+8);
    } else if(f.type==='WINDOW'&&trashLevel>=100){
      ctx.fillStyle=`rgba(255,255,255,${sparkleAlpha})`; ctx.fillRect(f.x-25,f.y-25,50,50);
      ctx.font='35px Arial'; ctx.fillText(f.e,f.x-17,f.y+15);
    } else {
      ctx.font='35px Arial'; ctx.fillText(f.e,f.x-17,f.y+15);
    }

    // Proximity glow (new feature, drawn after emoji so it's on top)
    if(gameActive&&Math.hypot(player.x-f.x,player.y-f.y)<72){
      ctx.save();
      ctx.strokeStyle='rgba(255,200,100,0.7)'; ctx.lineWidth=2.5;
      ctx.shadowColor='rgba(255,200,100,0.5)'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(f.x,f.y,38,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      if(f.label){
        ctx.save(); ctx.font='bold 10px Nunito,sans-serif';
        ctx.fillStyle='#5d4037'; ctx.textAlign='center';
        ctx.fillText(f.label,f.x,f.y-30); ctx.restore();
      }
    }
  });

  // 4. Customers
  customers.forEach(c=>{
    ctx.save();
    ctx.translate(c.x,c.y); ctx.scale(c.arrivalScale,c.arrivalScale); ctx.translate(-c.x,-c.y);
    if(c.img.complete&&c.img.naturalWidth>0)
      ctx.drawImage(c.img,c.x-30,c.y-30,60,60);
    else {
      ctx.fillStyle=c.isCritic?'gold':'#888';
      ctx.beginPath(); ctx.arc(c.x,c.y,25,0,Math.PI*2); ctx.fill();
    }
    // Thought bubble
    ctx.fillStyle='white';
    ctx.shadowColor='rgba(0,0,0,0.1)'; ctx.shadowBlur=5;
    ctx.beginPath(); ctx.arc(c.x+25,c.y-35,18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(c.x+16,c.y-22,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x+10,c.y-14,3,0,Math.PI*2); ctx.fill();
    ctx.font='16px Arial'; ctx.fillText(c.order,c.x+17,c.y-30);
    if(c.isCritic){
      ctx.font='bold 9px Nunito,sans-serif'; ctx.fillStyle='#d4a843'; ctx.textAlign='center';
      ctx.fillText('CRITIC',c.x,c.y+40);
    }
    ctx.restore();
    // Patience bar (outside scale transform)
    const pct=c.patience/c.maxPatience;
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(c.x-20,c.y+35,40,5);
    ctx.fillStyle=`rgb(${Math.round(255*(1-pct))},${Math.round(200*pct)},60)`;
    ctx.fillRect(c.x-20,c.y+35,40*pct,5);
  });

  // 5. Player
  const bob=Math.sin(player.bobTimer)*3;
  const px=player.x, py=player.y+bob;
  // Floor shadow
  ctx.fillStyle='rgba(80,40,10,0.15)';
  ctx.beginPath(); ctx.ellipse(px,player.y+30,24,8,0,0,Math.PI*2); ctx.fill();
  // Ready glow ring
  if(player.readyTimer>0){
    const pulse=Math.sin(Date.now()*0.015)*0.5+0.5;
    ctx.save();
    ctx.strokeStyle=`rgba(255,215,0,${0.5+pulse*0.4})`; ctx.lineWidth=3;
    ctx.shadowColor='#ffd700'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(px,py-4,40,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // Cooking ring
  if(kitchen.active){
    ctx.save(); ctx.strokeStyle='rgba(255,150,150,0.5)'; ctx.lineWidth=2;
    ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.arc(px,py-4,44,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
  // Cat sprite — same 70×70 as original
  if(catImg.complete&&catImg.naturalWidth>0){
    ctx.save();
    ctx.shadowColor='rgba(80,40,10,0.2)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
    if(player.facing==='left'){
      ctx.translate(px,py); ctx.scale(-1,1);
      ctx.drawImage(catImg,-35,-35+bob,70,70);
    } else {
      ctx.drawImage(catImg,px-35,py-35,70,70);
    }
    ctx.restore();
  }
  // Held item
  if(playerHolding){ ctx.font='22px Arial'; ctx.fillText(playerHolding,px+18,py-30); }
  // Ready label
  if(player.readyTimer>0){
    ctx.save(); ctx.font='bold 13px Nunito,sans-serif'; ctx.fillStyle='#d4a843';
    ctx.textAlign='center'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=8;
    ctx.fillText('✨ Ready!',px,py-52); ctx.restore();
  }

  // 6. Effects
  musicNotes.forEach(n=>{
    ctx.save(); ctx.globalAlpha=n.life; ctx.font='18px Arial';
    ctx.fillText('♪',n.x,n.y); ctx.restore();
  });
  floatingTips.forEach(t=>{
    ctx.save(); ctx.globalAlpha=t.life/t.maxLife;
    ctx.font='bold 15px Nunito,sans-serif'; ctx.fillStyle='#2d7a2d';
    ctx.textAlign='center'; ctx.shadowColor='#88ff88'; ctx.shadowBlur=8;
    ctx.fillText(t.text,t.x,t.y); ctx.restore();
  });
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

// Match original: set canvas size on window.onload
window.onload = function(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  loop();
};
</script>
</body>
</html>
