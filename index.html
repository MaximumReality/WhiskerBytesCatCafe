<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisker Bytes Cat Cafe - Maximum Reality Edition</title>
  <style>
    :root {
      --pink: #ffc0cb;
      --brown: #6b3e2e;
      --mochi-blue: #00f2ff;
      --jinx-amber: #ffaa00;
      --soft-bg: #f7d2c4;
      --glow-intensity: 15px;
    }

    /* Global Themes */
    body {
      background: radial-gradient(circle, #fce4ec, var(--soft-bg));
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      margin: 0;
      transition: all 0.5s ease;
      color: var(--brown);
      overflow-x: hidden;
    }

    body.night-mode {
      background: radial-gradient(circle, #2d1b33, #0f0a1e);
      color: #e0e0e0;
    }

    header {
      background-color: var(--brown);
      color: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid var(--pink);
    }

    section {
      margin: 20px auto;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.9);
      border: 6px solid var(--brown);
      border-radius: 40px;
      padding: 20px;
      box-shadow: 8px 8px 0px var(--pink);
      position: relative;
      z-index: 10;
    }

    body.night-mode section {
      background: rgba(20, 15, 30, 0.95);
      border-color: #ff00ff;
      box-shadow: 8px 8px 0px #4a004a;
    }

    /* Cat Sprites & Animations */
    .cat-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
    
    .cat-card { text-align: center; width: 140px; transition: transform 0.3s; }
    
    .cat-avatar {
      width: 100px;
      height: 100px;
      margin: 20px auto;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      border: 3px solid #333;
      background: #eee;
      animation: breathe 3s ease-in-out infinite;
      cursor: pointer;
    }

    /* PNG PLACEHOLDER STYLE: If you add PNGs, this handles them */
    .cat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; /* Hidden until you add <img src="..."> */
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Breed Visuals */
    .mochi .cat-avatar { background: #fce4ec; border-color: var(--mochi-blue); }
    .jinx .cat-avatar { background: #4a4a4a; border-color: var(--jinx-amber); }

    /* Eyes & Tufts */
    .eyes { position: absolute; top: 40%; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; }
    .eye { width: 10px; height: 10px; border-radius: 50%; background: white; box-shadow: 0 0 5px white; }
    .mochi .eye { background: var(--mochi-blue); box-shadow: 0 0 var(--glow-intensity) var(--mochi-blue); }

    .jinx .cat-avatar::before, .jinx .cat-avatar::after {
      content: ''; position: absolute; top: -20px; border-left: 12px solid transparent; 
      border-right: 12px solid transparent; border-bottom: 20px solid #4a4a4a;
    }
    .jinx .cat-avatar::before { left: -5px; transform: rotate(-20deg); filter: drop-shadow(0 -5px 5px var(--jinx-amber)); }
    .jinx .cat-avatar::after { right: -5px; transform: rotate(20deg); filter: drop-shadow(0 -5px 5px var(--jinx-amber)); }

    /* Mood Meters */
    .mood-container { width: 80px; height: 8px; background: #ddd; border-radius: 4px; margin: 5px auto; overflow: hidden; border: 1px solid #999; }
    .mood-bar { height: 100%; width: 50%; background: linear-gradient(90deg, #ff66b2, #ff00ff); transition: width 0.5s; }

    /* UI Sidebars */
    #toy-tray, #cat-tower { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.3); backdrop-filter: blur(5px); border-radius: 30px; padding: 10px; border: 3px solid var(--brown); z-index: 50; }
    #toy-tray { left: 15px; display: flex; flex-direction: column; gap: 15px; }
    #cat-tower { right: 15px; height: 300px; width: 60px; display: flex; flex-direction: column; justify-content: space-between; }
    
    .toy { font-size: 2rem; cursor: grab; text-align: center; }
    .tower-spot { width: 40px; height: 10px; background: var(--brown); border-radius: 5px; margin: auto; cursor: pointer; position: relative; }
    .tower-occupant { position: absolute; bottom: 10px; left: -30px; transform: scale(0.6); }

    /* Binary Rain */
    .rain-box { position: relative; overflow: hidden; }
    .rain-box::before {
      content: "101100101"; position: absolute; top: 0; color: rgba(107, 62, 46, 0.05); font-size: 10px; animation: rain-scroll 10s linear infinite;
    }
    @keyframes rain-scroll { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

    /* Buttons & Interactions */
    .controls { text-align: center; padding: 10px; }
    button { padding: 10px 15px; border-radius: 20px; border: none; background: var(--brown); color: white; cursor: pointer; font-family: inherit; margin: 5px; }
    button:hover { filter: brightness(1.2); }
  </style>
</head>
<body>

<header>Whisker Bytes Cafe</header>

<div class="controls">
  <button onclick="toggleNightMode()">🌙 Cyber-Night</button>
  <button id="photo-mode-btn" onclick="togglePhotoMode()">📸 Photo Mode</button>
</div>

<div id="toy-tray">
  <div class="toy" id="laser" draggable="true">🔴</div>
  <div class="toy" id="fish" draggable="true">🐟</div>
  <div class="toy" id="feather" draggable="true">🪶</div>
</div>

<div id="cat-tower">
  <div class="tower-spot" onclick="jumpToTower(this)"><div class="tower-occupant"></div></div>
  <div class="tower-spot" onclick="jumpToTower(this)"><div class="tower-occupant"></div></div>
  <div class="tower-spot" onclick="jumpToTower(this)"><div class="tower-occupant"></div></div>
</div>

<section id="lounge">
  <div class="cat-grid">
    <div class="cat-card mochi" id="mochi-card">
      <div class="cat-avatar" ondrop="dropToy(event, 'mochi')" ondragover="allowDrop(event)">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      </div>
      <strong>Mochi</strong>
      <div class="mood-container"><div class="mood-bar" id="mochi-mood"></div></div>
    </div>

    <div class="cat-card jinx" id="jinx-card">
      <div class="cat-avatar" ondrop="dropToy(event, 'jinx')" ondragover="allowDrop(event)">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      </div>
      <strong>Jinx</strong>
      <div class="mood-container"><div class="mood-bar" id="jinx-mood"></div></div>
    </div>
  </div>
  <p id="status-text" style="text-align: center; font-weight: bold;"></p>
</section>

<section class="rain-box">
  <h3>Adoption Desk</h3>
  <p>Gingerella (12yrs) - 100% compatible with your hardware.</p>
</section>

<div id="music-player" style="position:fixed; bottom:10px; left:10px; background:rgba(255,255,255,0.5); padding:10px; border-radius:20px;">
  🎵 Lo-Fi Purr <button onclick="toggleMusic()">⏯️</button>
</div>

<script>
  let moodLevels = { mochi: 50, jinx: 50 };

  function toggleNightMode() {
    document.body.classList.toggle('night-mode');
  }

  function allowDrop(ev) { ev.preventDefault(); }
  
  document.querySelectorAll('.toy').forEach(toy => {
    toy.ondragstart = (e) => e.dataTransfer.setData("toyId", e.target.id);
  });

  function dropToy(ev, cat) {
    ev.preventDefault();
    const toyId = ev.dataTransfer.getData("toyId");
    moodLevels[cat] = Math.min(moodLevels[cat] + 15, 100);
    document.getElementById(`${cat}-mood`).style.width = moodLevels[cat] + "%";
    document.getElementById('status-text').innerText = `${cat.toUpperCase()} loved the ${toyId}!`;
    
    // Trigger "Super Glow" if happy
    if(moodLevels[cat] > 80) {
        document.querySelector(`.${cat} .cat-avatar`).style.boxShadow = "0 0 30px white";
    }
  }

  function jumpToTower(spot) {
    const mochi = document.querySelector('.mochi .cat-avatar');
    spot.querySelector('.tower-occupant').appendChild(mochi);
    document.getElementById('status-text').innerText = "Mochi claimed the high ground!";
  }

  function togglePhotoMode() {
    const sections = document.querySelectorAll('section, #toy-tray, #cat-tower, header, .controls, #music-player');
    const isPhoto = document.getElementById('photo-mode-btn').innerText.includes("Photo");
    
    sections.forEach(s => {
        if(s.id !== 'lounge' && s.tagName !== 'BUTTON') s.style.display = isPhoto ? 'none' : 'block';
    });
    document.getElementById('photo-mode-btn').innerText = isPhoto ? "📸 Exit" : "📸 Photo Mode";
  }

  function toggleMusic() { alert("Simulating Lo-Fi Audio... Purr Purr..."); }
</script>

</body>
</html>
