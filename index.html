<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisker Bytes: Fixed Lounge</title>
  <style>
    :root {
      --pink: #ffc0cb;
      --brown: #6b3e2e;
      --mochi-blue: #00f2ff;
      --jinx-amber: #ffaa00;
      --shelf-color: rgba(255, 255, 255, 0.4);
    }

    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background-color: #f7d2c4;
      background-image: url('IMG_2480.jpeg');
      background-repeat: repeat;
      background-size: 400px;
      animation: backgroundScroll 60s linear infinite;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @keyframes backgroundScroll {
      from { background-position: 0 0; }
      to { background-position: 400px 400px; }
    }

    /* FIXED FLOOR: Solid background and explicit grid */
    #floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 18vh;
      background-color: #ffffff; /* Blocks wallpaper from showing below */
      display: grid;
      grid-template-columns: repeat(10, 1fr); /* 10 tiles wide */
      grid-template-rows: repeat(2, 1fr);    /* 2 tiles deep */
      border-top: 5px solid var(--brown);
      z-index: 100; /* Ensures it is above the wallpaper */
      box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    }

    .tile { 
      width: 100%; 
      height: 100%; 
      background-size: cover; 
      background-position: center;
    }

    /* Checkerboard Pattern Logic */
    /* Row 1: Odd tiles = Pattern A */
    #floor .tile:nth-child(-n+10):nth-child(odd) { background-image: url('tile1.png'); }
    /* Row 1: Even tiles = Pattern B */
    #floor .tile:nth-child(-n+10):nth-child(even) { background-image: url('tile2.png'); }
    /* Row 2: Odd tiles = Pattern B */
    #floor .tile:nth-child(n+11):nth-child(odd) { background-image: url('tile2.png'); }
    /* Row 2: Even tiles = Pattern A */
    #floor .tile:nth-child(n+11):nth-child(even) { background-image: url('tile1.png'); }

    header {
      background: rgba(107, 62, 46, 0.9);
      backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
    }

    #game-stage {
      position: relative;
      flex-grow: 1;
      width: 100%;
      z-index: 10;
    }

    .shelf {
      position: absolute;
      background: var(--shelf-color);
      backdrop-filter: blur(5px);
      height: 14px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.6);
      cursor: pointer;
      z-index: 20;
    }

    .cat-sprite {
      position: absolute;
      width: 110px;
      height: 110px;
      z-index: 150; /* Above the floor base */
      transition: left 1.2s ease-in-out, top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .cat-sprite img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: breathe 3s infinite ease-in-out;
    }

    .cat-sprite.sleeping img { filter: grayscale(0.7) brightness(0.5); }
    
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    #toy-box {
      position: fixed;
      bottom: 20vh; /* Sits above the fixed floor height */
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      padding: 12px 30px;
      border-radius: 50px;
      border: 3px solid var(--brown);
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 300;
    }

    .toy { font-size: 2.5rem; cursor: grab; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h2 style="margin:0;">Whisker Bytes Lounge</h2>
    <button onclick="togglePhoto()" style="padding:8px 18px; border-radius:20px; border:none; background:var(--pink); cursor:pointer; font-weight:bold;">📸 Photo Mode</button>
  </header>

  <div id="game-stage">
    <div class="shelf" style="top: 20%; left: 15%; width: 180px;" onclick="moveCat(15, 20)"></div>
    <div class="shelf" style="top: 45%; left: 42%; width: 200px;" onclick="moveCat(42, 45)"></div>
    <div class="shelf" style="top: 25%; left: 70%; width: 170px;" onclick="moveCat(70, 25)"></div>

    <div id="mochi" class="cat-sprite" style="left: 10%; top: 72%;" onclick="wakeAndSelect('mochi')">
      <img src="mochi_idle.png" alt="Mochi">
    </div>
    <div id="jinx" class="cat-sprite" style="left: 30%; top: 72%;" onclick="wakeAndSelect('jinx')">
      <img src="jinx_idle.png" alt="Jinx">
    </div>
    <div id="luna" class="cat-sprite" style="left: 50%; top: 72%;" onclick="wakeAndSelect('luna')">
      <img src="luna_idle.png" alt="Luna">
    </div>
    <div id="gingerella" class="cat-sprite" style="left: 70%; top: 72%;" onclick="wakeAndSelect('gingerella')">
      <img src="gingerella_idle.png" alt="Gingerella">
    </div>
  </div>

  <div id="floor"></div>

  <div id="toy-box">
    <div class="toy" draggable="true" ondragstart="drag(event)" id="laser">🔴</div>
    <div class="toy" draggable="true" ondragstart="drag(event)" id="fish">🐟</div>
    <div id="status" style="font-size:0.9rem; font-weight:bold;">Select a cat!</div>
  </div>

  <script>
    let selectedCat = null;

    // Create exactly 20 tiles (10x2 grid)
    const floor = document.getElementById('floor');
    for (let i = 0; i < 20; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      floor.appendChild(tile);
    }

    function wakeAndSelect(id) {
      selectedCat = id;
      document.getElementById('status').innerText = id.toUpperCase() + " active!";
    }

    function moveCat(x, y) {
      if (!selectedCat) return;
      const cat = document.getElementById(selectedCat);
      cat.style.left = x + "%";
      cat.style.top = (y - 12) + "%"; 
    }

    function drag(ev) { ev.dataTransfer.setData("toy", ev.target.id); }

    function togglePhoto() {
      document.getElementById('toy-box').classList.toggle('hidden');
      document.querySelectorAll('.shelf').forEach(s => s.classList.toggle('hidden'));
    }
  </script>
</body>
</html>
