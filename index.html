<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>whisker bytes: ny edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<style>
    :root { --wood: #5d4037; --floor: #d2b48c; --pink: #ffc0cb; --gold: #d4af37; --rush: #ff007f; }
    * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
    canvas { display: block; background: #3d2b1f; width: 100vw; height: 100vh; }
    
    #overlay { position: fixed; inset: 0; background: #4a2c2a url('IMG_2475.jpeg') center/cover; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 5000; color: white; text-align: center; padding-bottom: 50px; }
    #logo-header { position: absolute; top: 0; left: 0; width: 100%; height: 45%; background: url('whiskerbytes.png') center/contain no-repeat; z-index: 5001; pointer-events: none; }
    
    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; z-index: 6000; }
    .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #333; font-weight: bold; width: 110px; text-transform: lowercase; }
    .btn-select img { width: 50px; height: 50px; display: block; margin: 0 auto; }

    #day-over { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--wood); color: white; padding: 40px; border: 5px solid var(--gold); border-radius: 25px; text-align: center; z-index: 9000; display: none; box-shadow: 0 0 50px var(--rush); text-transform: lowercase; }
    .sparkle { animation: flash 0.5s infinite alternate; color: var(--gold); }
    @keyframes flash { from { opacity: 0.5; } to { opacity: 1; text-shadow: 0 0 10px gold; } }

    #stats { position: fixed; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 12px; border: 3px solid var(--wood); z-index: 100; font-weight: bold; display: none; text-transform: lowercase; }
    #controls { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 5px; z-index: 1000; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 24px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="overlay">
    <div id="logo-header"></div> 
    <div class="char-grid">
        <div onpointerdown="startGame('mochi')" class="btn-select"><img src="mochi_idle.png">mochi</div>
        <div onpointerdown="startGame('gingerella')" class="btn-select"><img src="gingerella_idle.png">ginger</div>
        <div onpointerdown="startGame('luna')" class="btn-select"><img src="luna_idle.png">luna</div>
        <div onpointerdown="startGame('jinx')" class="btn-select"><img src="jinx_idle.png">jinx</div>
    </div>
</div>

<div id="day-over">
    <h1>🎆 shift over! 🎆</h1>
    <h2 id="finalScore">score: 0</h2>
    <p id="newBest" style="display:none;" class="sparkle">✨ new personal best! ✨</p>
    <button class="btn-select" onclick="location.reload()" style="width:160px; height:50px; font-size:20px;">replay</button>
</div>

<div id="stats">
    ⭐ <span id="scoreVal">0</span> | 🏆 best: <span id="highVal">0</span><br>
    🕒 <span id="timeVal">9:00 am</span><br>
    <span id="holdingTxt" style="color: #8b4513;">🐾 empty</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
    <div class="d-pad">
        <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
        <button class="ctrl-btn" id="left">⬅️</button>
        <button class="ctrl-btn" id="down">⬇️</button>
        <button class="ctrl-btn" id="right">➡️</button>
    </div>
    <button class="ctrl-btn" id="action-btn" style="width:140px; border-radius: 35px; background:var(--pink); text-transform: lowercase;" onpointerdown="interact()">📢 meow</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let gameActive = false, score = 0, gameMinutes = 540;
let playerHolding = null, tvActive = false, radioActive = false, cakeUnlocked = false;
const catImg = new Image(), bgImg = new Image(), f1 = new Image(), f2 = new Image(), f3 = new Image();
f1.src = 'friend1.png'; f2.src = 'friend2.png'; f3.src = 'friend3.png';

const player = { x: 200, y: 350, speed: 5, facing: 1, baseFacing: 1, cookTime: 60 };
let furniture = [], customers = [], musicNotes = [];
const keys = { up: false, down: false, left: false, right: false };

let highScore = localStorage.getItem("whiskerBytesHigh") || 0;
document.getElementById('highVal').innerText = highScore;

window.startGame = function(catId) {
    catImg.src = catId + '_idle.png';
    bgImg.src = 'IMG_2480.jpeg'; 
    player.baseFacing = (catId === 'mochi') ? 1 : -1;
    player.speed = (catId === 'luna') ? 8 : 5;
    player.cookTime = (catId === 'mochi') ? 35 : 65;
    
    const floorTop = 165; 
    const floorBottom = canvas.height - 180;
    const midY = floorTop + (floorBottom - floorTop) / 2;

    furniture = [
        {x: 60, y: 200, type: "STATION", item: "☕", e: "☕"},
        {x: 130, y: 200, type: "STATION", item: "🍪", e: "🍪"},
        {x: 200, y: 200, type: "STATION", item: "🍼", e: "🍼"},
        {x: 350, y: 200, type: "TRASH", e: "🗑️"},
        {x: 50, y: midY, type: "RADIO", e: "📻"},
        {x: canvas.width - 50, y: midY, type: "TV", e: "📺"},
        {x: canvas.width / 2, y: midY, type: "TABLE", e: "🟫"},
        {x: canvas.width / 2 - 60, y: midY, type: "CHAIR", e: "🪑", occupied: false},
        {x: canvas.width / 2 + 60, y: midY, type: "CHAIR", e: "🪑", occupied: false}
    ];

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('stats').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';
    gameActive = true;
    requestAnimationFrame(loop);
};

function interact() {
    furniture.forEach(f => {
        if (Math.hypot(player.x - f.x, player.y - f.y) < 75) {
            if (f.type === "STATION" && !playerHolding) { player.busy = true; player.timer = player.cookTime; player.item = f.item; }
            if (f.type === "TRASH") { playerHolding = null; document.getElementById('holdingTxt').innerText = "🐾 empty"; }
            if (f.type === "RADIO") radioActive = !radioActive;
            if (f.type === "TV") tvActive = !tvActive;
        }
    });

    customers.forEach(c => {
        if (Math.hypot(player.x - c.x, player.y - c.y) < 85 && playerHolding === c.order) {
            score += c.isCritic ? 500 : 75;
            playerHolding = null; c.chair.occupied = false;
            customers = customers.filter(cust => cust !== c);
            document.getElementById('holdingTxt').innerText = "🐾 empty";
        }
    });
}

function update() {
    if (!gameActive) return;

    if (player.busy) {
        player.timer--;
        if (player.timer <= 0) { player.busy = false; playerHolding = player.item; document.getElementById('holdingTxt').innerText = playerHolding; }
    } else {
        if (keys.up) player.y -= player.speed; if (keys.down) player.y += player.speed;
        if (keys.left) { player.x -= player.speed; player.facing = -1; } if (keys.right) { player.x += player.speed; player.facing = 1; }
    }

    gameMinutes += 0.15;
    if (gameMinutes >= 1260) { 
        gameActive = false;
        if(score > highScore) { localStorage.setItem("whiskerBytesHigh", score); document.getElementById('newBest').style.display = 'block'; }
        document.getElementById('finalScore').innerText = "score: " + score;
        document.getElementById('day-over').style.display = 'block';
    }
    
    if (score >= 300 && !cakeUnlocked) { cakeUnlocked = true; furniture.push({x: 270, y: 200, type: "STATION", item: "🍰", e: "🍰"}); }

    if (Math.random() < (gameMinutes > 1200 ? 0.025 : 0.007)) {
        let chair = furniture.find(f => f.type === "CHAIR" && !f.occupied);
        if (chair) { 
            chair.occupied = true;
            let isCritic = Math.random() < 0.15; 
            customers.push({ 
                x: chair.x, y: chair.y, chair, 
                order: isCritic ? (cakeUnlocked ? "🍰" : "☕") : (cakeUnlocked && Math.random() > 0.7 ? "🍰" : ["☕", "🍪", "🍼"][Math.floor(Math.random()*3)]),
                isCritic, img: isCritic ? f3 : (Math.random() > 0.5 ? f1 : f2)
            });
        }
    }

    if (radioActive && Math.random() < 0.1) musicNotes.push({ x: 50, y: 300, vx: 1 + Math.random()*3, vy: -1 + Math.random()*2, life: 300 });
    musicNotes.forEach((n, i) => { n.x += n.vx; n.y += n.vy; n.life--; if(n.life<=0) musicNotes.splice(i,1); });

    // BOUNCE PHYSICS
    if (player.y < 235) player.y = 237;
    if (player.y > canvas.height - 215) player.y = canvas.height - 217;
    if (player.x < 30) player.x = 32;
    if (player.x > canvas.width - 30) player.x = canvas.width - 32;
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    if(bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, 160);
    
    const isRush = gameMinutes >= 1200;
    const tileSize = 60;
    for(let x=0; x<canvas.width; x+=tileSize) {
        for(let y=160; y<canvas.height; y+=tileSize) {
            ctx.fillStyle = isRush ? (Math.random() > 0.9 ? "#ff007f" : "#4a0026") : ((x+y)/tileSize%2===0 ? "#d2b48c" : "#c1a37b");
            ctx.fillRect(x, y, tileSize, tileSize);
        }
    }

    musicNotes.forEach(n => { ctx.font="20px Arial"; ctx.fillText("♪", n.x, n.y); });

    furniture.forEach(f => {
        ctx.font = "40px Arial"; ctx.fillText(f.e, f.x-20, f.y+15);
        if(f.type === "TV" && tvActive) {
            ctx.fillStyle = "rgba(0, 255, 255, 0.2)";
            ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x-80, canvas.height); ctx.lineTo(f.x+80, canvas.height); ctx.fill();
        }
    });

    customers.forEach(c => {
        if(c.img.complete) ctx.drawImage(c.img, c.x-35, c.y-35, 70, 70);
        if(c.isCritic) { ctx.strokeStyle="gold"; ctx.lineWidth=4; ctx.strokeRect(c.x-37, c.y-37, 74, 74); }
        ctx.fillStyle="white"; ctx.font="bold 20px Arial"; ctx.fillText(c.order, c.x-10, c.y-45);
    });

    ctx.save(); ctx.translate(player.x, player.y);
    if(player.facing !== player.baseFacing) ctx.scale(-1, 1);
    ctx.drawImage(catImg, -35, -35, 70, 70);
    ctx.restore();

    if(player.busy) { ctx.fillStyle="lime"; ctx.fillRect(player.x-30, player.y-50, (player.timer/player.cookTime)*60, 10); }

    document.getElementById('scoreVal').innerText = score;
    let h = Math.floor(gameMinutes/60), m = Math.floor(gameMinutes%60);
    document.getElementById('timeVal').innerText = (h%12||12)+":"+(m<10?'0':'')+m+(h>=12?' pm':' am');
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

window.onload = () => {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    ["up","down","left","right"].forEach(id => {
        let b = document.getElementById(id);
        b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[id] = true; });
        b.addEventListener('pointerup', (e) => { e.preventDefault(); keys[id] = false; });
    });
};
</script>
</body>
</html>
