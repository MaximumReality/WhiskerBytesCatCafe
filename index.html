<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: LOGO EDITION</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    :root { --wood: #5d4037; --floor: #d2b48c; --pink: #ffc0cb; }
    
    /* FIX: Prevents the annoying copy/paste/lookup popup */
    * { 
        -webkit-touch-callout: none; 
        -webkit-user-select: none; 
        user-select: none; 
        -webkit-tap-highlight-color: transparent;
    }

    body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
    canvas { display: block; touch-action: none; background: var(--floor); width: 100vw; height: 100vh; }
    
    /* WELCOME SCREEN - Moroccan Tile Background */
    #overlay { 
        position: fixed; inset: 0; 
        background: #4a2c2a url('IMG_2475.jpeg') center/cover; 
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
        z-index: 5000; color: white; text-align: center;
        padding-bottom: 50px;
    }

    /* LOGO OVERLAY - Top Half */
    #logo-header {
        position: absolute; top: 0; left: 0; width: 100%; height: 45%;
        background: url('whiskerbytes.png') center/contain no-repeat;
        z-index: 5001;
    }

    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; position: relative; z-index: 10; margin-top: 20px; }
    .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #333; cursor: pointer; }
    .btn-select img { width: 50px; height: 50px; display: block; margin: 0 auto; }

    #stats { position: fixed; top: 10px; left: 10px; background: rgba(255,255,255,0.95); padding: 12px; border-radius: 12px; border: 3px solid var(--wood); z-index: 100; font-weight: bold; display: none; }
    #ui-right { position: fixed; top: 10px; right: 10px; z-index: 100; display: none; }
    .ui-btn { background: var(--pink); border: 2px solid white; padding: 10px 15px; font-weight: bold; border-radius: 8px; }

    #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 8px; z-index: 1000; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ctrl-btn { width: 65px; height: 65px; border-radius: 50%; border: 4px solid var(--wood); background: white; font-size: 28px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="overlay">
    <div id="logo-header"></div> <div class="char-grid">
        <div class="btn-select" onpointerdown="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
        <div class="btn-select" onpointerdown="startGame('gingerella')"><img src="gingerella_idle.png">GINGER</div>
        <div class="btn-select" onpointerdown="startGame('luna')"><img src="luna_idle.png">LUNA</div>
        <div class="btn-select" onpointerdown="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
    </div>
</div>

<script>
// (All previous JavaScript remains the same, but ensure you use 'onpointerdown' 
// for the d-pad buttons to keep it snappy and avoid the highlight bug!)

window.onload = () => {
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;
    
    const btns = ["up","down","left","right"];
    btns.forEach(id => {
        let b = document.getElementById(id);
        // Using pointerdown + preventDefault kills the "Copy/Find" popup
        b.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            keys[id] = true;
        }, { passive: false });

        b.addEventListener('pointerup', (e) => {
            e.preventDefault();
            keys[id] = false;
        }, { passive: false });
    });
};

// RESTORE NEWS CAT & TICKER
function drawTV(f) {
    if(tvActive) {
        ctx.fillStyle = "black";
        ctx.fillRect(f.x - 25, f.y - 15, 50, 30);
        ctx.font = "16px Arial";
        ctx.fillText("🐱🎤", f.x - 15, f.y + 5);
        
        // Breaking News Ticker
        let tickerX = (Date.now() / 20) % 150;
        ctx.fillStyle = "red";
        ctx.font = "bold 8px Arial";
        ctx.fillText("BREAKING NEWS: FISH PRICES UP!", f.x + 25 - tickerX, f.y + 12);
    }
}
</script>
</body>
</html>
