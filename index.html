<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; --gold: #ffd700; --tip: #2ecc71; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay, #results-overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; text-align: center; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; }
  .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 12px; }
  #ui-top-right { position: fixed; top: 10px; right: 10px; z-index: 101; display: none; gap: 5px; }
  .ui-btn { background: var(--pink); border: 2px solid white; border-radius: 5px; padding: 8px; font-weight: bold; color: #4a2c2a; }

  #shop-menu { position: fixed; top: 0; right: -260px; width: 220px; height: 100%; background: white; border-left: 5px solid var(--wood); z-index: 3000; transition: 0.3s; padding: 20px; color: #4a2c2a; }
  #shop-menu.open { right: 0; }

  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 5px; z-index: 500; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 20px; }
  #action-btn { background: var(--pink); width: 80px; font-size: 24px; }
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" style="width:140px; border-radius:10px;">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('luna')"><img src="luna_idle.png">LUNA</div>
    <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
    <div class="btn-select" onclick="startGame('gingerella')"><img src="gingerella_idle.png">GINGER</div>
  </div>
</div>

<div id="shop-menu">
    <h3>CAT CAFE SHOP</h3>
    <button class="ui-btn" onclick="buyFurniture()">Buy Table (200)</button><br><br>
    <button class="ui-btn" style="background:#ccc" onclick="toggleShop()">⬅ BACK</button><br><br>
    <button class="ui-btn" style="background:#ff4444; color:white" onclick="resetSave()">WIPE SAVE</button>
</div>

<div id="results-overlay" style="display:none;">
    <h1 id="res-day">DAY COMPLETE</h1>
    <div id="res-stars" style="font-size:30px; color:var(--gold);">⭐⭐⭐</div>
    <p>Daily Profit: <span id="res-profit">0</span></p>
    <button class="ui-btn" style="padding:15px;" onclick="nextDay()">START NEXT DAY ☀️</button>
</div>

<div id="ui-top-right">
    <button class="ui-btn" onclick="toggleShop()">🛒 SHOP</button>
</div>

<div id="stats">
    <b>DAY <span id="dayVal">1</span></b> | <span id="timeVal">9:00 AM</span><br>
    <b>⭐ <span id="scoreVal">0</span></b><br>
    <span id="holdingTxt" style="color:brown">Empty Paws</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
  <button class="ctrl-btn" id="action-btn" onclick="interact()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, gameState = "START", playerHolding = null;
let currentDay = 1, gameMinutes = 540, dayServed = 0, dayActive = false;

const catImg = new Image(), bgPattern = new Image();
const f1 = new Image(); f1.src = 'friend1.png';
const f2 = new Image(); f2.src = 'friend2.png'; // Baby
const friendImages = [f1, f2];

const player = { x: 0, y: 0, speed: 5, facing: 1, naturalDir: 1, meowing: 0, catName: "", tipTime: 0 };
let furniture = [], customers = [];

function startGame(cat) {
    catImg.src = cat + "_idle.png";
    bgPattern.src = 'IMG_2480.jpeg'; 
    player.catName = cat;
    player.speed = (cat === 'gingerella') ? 8 : 5;
    player.naturalDir = (cat === 'mochi') ? 1 : -1;
    player.facing = player.naturalDir; 
    
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('stats').style.display = 'block';
    document.getElementById('ui-top-right').style.display = 'flex';
    
    furniture = [
        { x: 60, y: 150, type: "COUNTER", emoji: "🏪", item: "☕" },
        { x: 120, y: 150, type: "COUNTER", emoji: "🏪", item: "🍪" },
        { x: 180, y: 150, type: "COUNTER", emoji: "🏪", item: "🍼" },
        { x: canvas.width/2, y: canvas.height/2 + 50, type: "TABLE", emoji: "🟫", solid: true },
        { x: canvas.width/2 - 60, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑" }, 
        { x: canvas.width/2 + 60, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑" }
    ];
    
    loadProgress();
    dayActive = true;
    gameState = "PLAYING";
    spawnCustomer();
}

function spawnCustomer() {
    if (!dayActive) return;
    const openChairs = furniture.filter(f => f.type === "CHAIR" && !f.occupied);
    if (openChairs.length > 0 && customers.length < openChairs.length) {
        const chair = openChairs[Math.floor(Math.random() * openChairs.length)];
        chair.occupied = true;
        const fIdx = Math.floor(Math.random() * friendImages.length);
        let order = (fIdx === 1) ? (Math.random() < 0.7 ? "🍼" : "🍪") : (Math.random() < 0.6 ? "☕" : "🍪");
        customers.push({ 
            x: chair.x, y: chair.y - 15, chair: chair, img: friendImages[fIdx], 
            order: order, entryTime: gameMinutes 
        });
    }
}

function interact() {
    player.meowing = 30;
    // Pickup
    furniture.forEach(f => {
        if(f.type === "COUNTER" && Math.abs(player.x - f.x) < 50 && Math.abs(player.y - f.y) < 50) {
            playerHolding = f.item;
            document.getElementById('holdingTxt').innerText = "Holding: " + playerHolding;
        }
    });
    // Delivery
    customers.forEach((c, i) => {
        if(Math.abs(player.x - c.x) < 70 && Math.abs(player.y - c.y) < 70 && playerHolding === c.order) {
            let bonus = 0;
            if (gameMinutes - c.entryTime < 60) { bonus = 20; player.tipTime = 40; } // Quick service tip!
            score += (50 + bonus); dayServed++; playerHolding = null;
            document.getElementById('holdingTxt').innerText = "Empty Paws";
            document.getElementById('scoreVal').innerText = score;
            c.chair.occupied = false; customers.splice(i, 1);
            setTimeout(spawnCustomer, 2000);
        }
    });
}

function update() {
    if (gameState !== "PLAYING" || !dayActive) return;
    gameMinutes += 0.35;
    if (Math.floor(gameMinutes / 60) >= 18) endDay();
    
    // Icon Swap Logic 📝 vs 📢
    let nearCust = customers.some(c => Math.abs(player.x - c.x) < 70 && Math.abs(player.y - c.y) < 70);
    document.getElementById('action-btn').innerText = nearCust ? "📝" : "📢";

    let nX = player.x, nY = player.y;
    if (keys.up) nY -= player.speed; if (keys.down) nY += player.speed;
    if (keys.left) nX -= player.speed; if (keys.right) nX += player.speed;
    let canM = true;
    furniture.forEach(f => { if(f.solid && Math.abs(nX - f.x) < 50 && Math.abs(nY - f.y) < 50) canM = false; });
    if(canM) { player.x = nX; player.y = nY; }
    player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
    player.y = Math.max(120, Math.min(canvas.height - 110, player.y));
}

function draw() {
    ctx.fillStyle = "#d2b48c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgPattern, 0, 0, canvas.width, 90);
    ctx.font = "40px Arial";
    furniture.forEach(f => {
        ctx.fillText(f.emoji, f.x - 20, f.y + 15);
        if(f.type === "COUNTER") { ctx.font = "14px Arial"; ctx.fillText(f.item, f.x - 10, f.y - 25); ctx.font = "40px Arial"; }
    });
    customers.forEach(c => {
        ctx.drawImage(c.img, c.x - 45, c.y - 45, 90, 90);
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x + 35, c.y - 35, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "black"; ctx.font = "16px Arial"; ctx.fillText(c.order, c.x + 27, c.y - 30);
    });
    ctx.save();
    ctx.translate(player.x, player.y);
    if (player.facing !== player.naturalDir) ctx.scale(-1, 1);
    ctx.drawImage(catImg, -45, -45, 90, 90);
    ctx.restore();
    
    if(player.tipTime > 0) {
        ctx.fillStyle = "#2ecc71"; ctx.font = "bold 20px Arial";
        ctx.fillText("+TIP!", player.x - 25, player.y - 80); player.tipTime--;
    }
    if(player.meowing > 0) {
        ctx.font = "bold 14px Arial"; ctx.fillStyle = "white";
        ctx.fillText(player.catName==='luna'?"💖 MEOW! 💖":"MEOW! 🐾", player.x-40, player.y-55);
        player.meowing--;
    }
}
// (Include endDay, nextDay, save/load, resize, bind, loop as before)
</script>
</body>
</html>
