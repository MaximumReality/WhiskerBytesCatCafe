<div id="shop-menu">
    <h3>SHOP</h3>
    <button class="ui-btn" onclick="buyFurniture()">Buy Table (200)</button><br><br>
    <button class="ui-btn" style="background:#ff4444; color:white" onclick="resetSave()">Wipe Save Data</button><br><br>
    <button class="ui-btn" onclick="toggleShop()">CLOSE</button>
</div>

<script>
// --- NEW SAVE & BABY LOGIC ---
const menu = ["☕", "🍪", "🍼"]; 

function saveGame() {
    const gameData = {
        score: score,
        currentDay: currentDay,
        furnitureCount: furniture.filter(f => f.type === "TABLE").length
    };
    localStorage.setItem('whiskerBytesSave', JSON.stringify(gameData));
}

function loadGame() {
    const saved = localStorage.getItem('whiskerBytesSave');
    if (saved) {
        const data = JSON.parse(saved);
        score = data.score;
        currentDay = data.currentDay;
        // Rebuild the extra tables purchased
        for(let i=1; i < data.furnitureCount; i++) {
            addTableSet();
        }
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('dayVal').innerText = currentDay;
    }
}

function resetSave() {
    if(confirm("Are you sure you want to delete your cafe's progress?")) {
        localStorage.removeItem('whiskerBytesSave');
        location.reload();
    }
}

// --- UPDATED COUNTER & ORDER LOGIC ---
// Add the Milk Counter to the furniture array in startGame()
// { x: 240, y: 150, type: "COUNTER", emoji: "🏪", item: "🍼" }

function spawnCustomer() {
    if (!dayActive) return;
    const openChairs = furniture.filter(f => f.type === "CHAIR" && !f.occupied);
    if (openChairs.length > 0 && customers.length < openChairs.length) {
        const chair = openChairs[Math.floor(Math.random() * openChairs.length)];
        chair.occupied = true;
        
        // Identify if friend is the baby (friend2)
        const friendIdx = Math.floor(Math.random() * friendImages.length);
        const isBaby = (friendIdx === 1); // Assuming friend2 is at index 1
        
        let finalOrder;
        if (isBaby) {
            // Baby orders milk 70% of the time, otherwise cookie
            finalOrder = Math.random() < 0.7 ? "🍼" : "🍪";
        } else {
            // Adults order coffee or cookies
            finalOrder = Math.random() < 0.5 ? "☕" : "🍪";
        }

        customers.push({ 
            x: chair.x, y: chair.y - 15, chair: chair, 
            img: friendImages[friendIdx],
            order: finalOrder
        });
    }
}

// Add saveGame() to your endDay() function
function endDay() {
    dayActive = false;
    // ... existing star logic ...
    saveGame(); // Automatically saves at the end of every day
    document.getElementById('results-overlay').style.display = 'flex';
}
</script>
