<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center; }
  #logo-img { width: 180px; margin-bottom: 20px; border-radius: 10px; border: 2px solid var(--pink); }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; }
  .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 14px; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 500; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 24px; touch-action: manipulation; box-shadow: 0 4px #888; }
  .ctrl-btn:active { transform: translateY(3px); box-shadow: none; }
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" id="logo-img">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
  </div>
</div>

<div id="stats"><b>SUSHI BOWL: <span id="scoreVal">0</span>/25</b></div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
  <button class="ctrl-btn" style="background:var(--pink); width: 80px;" onclick="meow()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, gameState = "START";
const catImg = new Image();
const bgPattern = new Image();

const player = { x: 0, y: 0, speed: 4, dir: 1, meowing: 0 };
const npc = { x: 0, y: 0, happy: 0 };
let sushiBowls = [];

function startGame(cat) {
  catImg.src = cat + "_idle.png";
  bgPattern.src = 'IMG_2480.jpeg'; 
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  gameState = "PLAYING";
  spawnSushi();
}

function spawnSushi() {
  sushiBowls = Array.from({length: 25}, () => ({
    x: 40 + Math.random() * (canvas.width - 80),
    y: 120 + Math.random() * (canvas.height - 240),
    collected: false
  }));
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  // Position lady in the upper-right area but fully on-screen
  npc.x = canvas.width - 100;
  npc.y = 150;
}
window.addEventListener("resize", resize); resize();

const keys = { up: false, down: false, left: false, right: false };
function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
  btn.ontouchend = () => { keys[k] = false; };
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

function meow() {
  player.meowing = 40;
  if(Math.abs(player.x - npc.x) < 80 && Math.abs(player.y - npc.y) < 80) npc.happy = 60;
}

function update() {
  if (gameState !== "PLAYING") return;
  if (keys.up) player.y -= player.speed;
  if (keys.down) player.y += player.speed;
  if (keys.left) { player.x -= player.speed; player.dir = -1; }
  if (keys.right) { player.x += player.speed; player.dir = 1; }

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(110, Math.min(canvas.height - 110, player.y));

  sushiBowls.forEach(s => {
    if(!s.collected && Math.abs(player.x - s.x) < 35 && Math.abs(player.y - s.y) < 35) {
      s.collected = true; score++;
      document.getElementById('scoreVal').innerText = score;
    }
  });
}

function draw() {
  // Floor
  ctx.fillStyle = "#d2b48c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Grid Tiles
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
  for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); }

  // Wallpaper Border
  ctx.drawImage(bgPattern, 0, 0, canvas.width, 90);

  // NPC Lady
  ctx.font = "40px Arial";
  ctx.fillText("👗", npc.x - 20, npc.y + 35);
  ctx.fillText("👩‍🦱", npc.x - 20, npc.y);
  if(npc.happy > 0) { ctx.fillText("❤️", npc.x, npc.y - 40); npc.happy--; }

  // Sushi
  sushiBowls.forEach(s => { if(!s.collected) { ctx.font = "24px Arial"; ctx.fillText("🍱", s.x - 12, s.y); } });

  // Jinx/Mochi Fixed Direction
  ctx.save();
  ctx.translate(player.x, player.y);
  if(player.dir === -1) ctx.scale(-1, 1); 
  // Drawing at -40, -40 ensures the cat flips exactly around its center
  ctx.drawImage(catImg, -40, -40, 80, 80);
  ctx.restore();

  if(player.meowing > 0) {
    ctx.font = "bold 14px Arial"; ctx.fillStyle = "white";
    ctx.fillText("MEOW! 🐾", player.x + 25, player.y - 35);
    player.meowing--;
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
