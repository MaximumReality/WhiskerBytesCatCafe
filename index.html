<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisker Bytes Cafe - Side Scroller Edition</title>
  <style>
    :root {
      --pink: #ffc0cb;
      --brown: #6b3e2e;
      --mochi-blue: #00f2ff;
      --jinx-amber: #ffaa00;
      --shelf-color: #d2b48c;
    }

    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: #f7d2c4 url('cafe_wallpaper.jpg') repeat-x;
      background-size: auto 100%;
      height: 100vh;
      overflow: hidden;
      color: var(--brown);
    }

    body.night-mode {
      background-color: #1a0f1f;
      filter: brightness(0.7) saturate(1.2);
    }

    header {
      background: var(--brown);
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      position: relative;
    }

    /* The Level / Stage */
    #game-stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      bottom: 0;
    }

    /* Platforms (Mario Style Shelves) */
    .shelf {
      position: absolute;
      background: var(--shelf-color);
      height: 20px;
      border-radius: 10px;
      border-bottom: 5px solid #a68b6a;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 10;
    }

    .shelf:hover { transform: scaleY(1.2); background: #e6ccac; }
    .shelf::after { content: '🐾'; position: absolute; top: -20px; right: 10px; opacity: 0.3; }

    /* The Cats (Sprites) */
    .cat-sprite {
      position: absolute;
      width: 120px;
      height: 120px;
      z-index: 20;
      transition: left 1s ease-in-out, top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: auto;
      cursor: pointer;
    }

    .cat-sprite img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: breathe 3s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Glow overlays for PNG eyes */
    .eyes-glow {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
    }
    .eye-point { width: 8px; height: 8px; border-radius: 50%; filter: blur(2px); }

    /* Alignment */
    .mochi .eyes-glow { top: 35%; padding: 0 30px; }
    .jinx .eyes-glow { top: 25%; padding: 0 40px; }
    .luna .eyes-glow { top: 45%; padding: 0 25px; }
    .gingerella .eyes-glow { top: 40%; padding: 0 30px; }

    .mochi .eye-point { background: var(--mochi-blue); box-shadow: 0 0 10px var(--mochi-blue); }
    .jinx .eye-point { background: var(--jinx-amber); box-shadow: 0 0 10px var(--jinx-amber); }

    /* UI Elements */
    #toy-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.8);
      padding: 10px 30px;
      border-radius: 50px;
      border: 4px solid var(--brown);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    .toy { font-size: 2.5rem; cursor: grab; }
    .mood-mini { width: 40px; height: 4px; background: #eee; border-radius: 2px; margin-top: -10px; }
    .mood-fill { height: 100%; width: 50%; background: var(--mochi-blue); }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h2 style="margin:0;">Whisker Bytes Side-Scroller</h2>
    <div>
      <button onclick="document.body.classList.toggle('night-mode')">🌙 Night</button>
      <button onclick="togglePhoto()">📸 Photo</button>
    </div>
  </header>

  <div id="game-stage">
    <div class="shelf" style="top: 20%; left: 10%; width: 200px;" onclick="moveCat('mochi', 10, 20)"></div>
    <div class="shelf" style="top: 40%; left: 40%; width: 250px;" onclick="moveCat('jinx', 40, 40)"></div>
    <div class="shelf" style="top: 60%; left: 15%; width: 150px;" onclick="moveCat('luna', 15, 60)"></div>
    <div class="shelf" style="top: 75%; left: 65%; width: 200px;" onclick="moveCat('gingerella', 65, 75)"></div>
    <div class="shelf" style="top: 30%; left: 70%; width: 180px;" onclick="moveCat('mochi', 70, 30)"></div>

    <div id="mochi" class="cat-sprite mochi" style="left: 10%; top: 70%;" onclick="interact('mochi')">
      <img src="mochi_idle.png" alt="Mochi" onerror="this.src='https://via.placeholder.com/100?text=Mochi'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
      <div class="mood-mini"><div id="mochi-bar" class="mood-fill"></div></div>
    </div>

    <div id="jinx" class="cat-sprite jinx" style="left: 40%; top: 70%;" onclick="interact('jinx')">
      <img src="jinx_idle.png" alt="Jinx" onerror="this.src='https://via.placeholder.com/100?text=Jinx'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
      <div class="mood-mini"><div id="jinx-bar" class="mood-fill"></div></div>
    </div>

    <div id="luna" class="cat-sprite luna" style="left: 60%; top: 70%;" onclick="interact('luna')">
      <img src="luna_idle.png" alt="Luna" onerror="this.src='https://via.placeholder.com/100?text=Luna'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
      <div class="mood-mini"><div id="luna-bar" class="mood-fill"></div></div>
    </div>

    <div id="gingerella" class="cat-sprite gingerella" style="left: 80%; top: 70%;" onclick="interact('gingerella')">
      <img src="gingerella_idle.png" alt="Ginger" onerror="this.src='https://via.placeholder.com/100?text=Ginger'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
      <div class="mood-mini"><div id="gingerella-bar" class="mood-fill"></div></div>
    </div>
  </div>

  <div id="toy-box">
    <div class="toy" draggable="true" ondragstart="drag(event)" id="laser">🔴</div>
    <div class="toy" draggable="true" ondragstart="drag(event)" id="fish">🐟</div>
    <div class="toy" draggable="true" ondragstart="drag(event)" id="feather">🪶</div>
    <div id="status" style="font-size: 0.8rem; width: 100px; padding-left: 10px;">Click a shelf to make a cat jump!</div>
  </div>

  <script>
    let moods = { mochi: 50, jinx: 50, luna: 50, gingerella: 50 };
    let selectedCat = 'mochi';

    // Set the cat you want to move by clicking it first
    function interact(catId) {
      selectedCat = catId;
      document.getElementById('status').innerText = "Selected: " + catId;
      
      // Fun squash effect
      const el = document.getElementById(catId);
      el.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.2, 0.8)' },
        { transform: 'scale(1)' }
      ], { duration: 300 });

      moods[catId] = Math.min(moods[catId] + 5, 100);
      document.getElementById(catId + '-bar').style.width = moods[catId] + '%';
    }

    function moveCat(catId, x, y) {
      // Logic: The "Selected Cat" jumps to the shelf you clicked
      const el = document.getElementById(selectedCat);
      
      // Calculate position so cat sits ON TOP of shelf
      el.style.left = x + "%";
      el.style.top = (y - 12) + "%"; 
      
      document.getElementById('status').innerText = selectedCat + " jumped!";
    }

    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

    document.getElementById('game-stage').ondragover = (e) => e.preventDefault();
    document.getElementById('game-stage').ondrop = (e) => {
      e.preventDefault();
      interact(selectedCat);
      document.getElementById('status').innerText = selectedCat + " loved the toy!";
    };

    function togglePhoto() {
      document.getElementById('toy-box').classList.toggle('hidden');
      document.querySelectorAll('.shelf').forEach(s => s.classList.toggle('hidden'));
    }
  </script>
</body>
</html>
