<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisker Bytes: Endless Sushi Lounge</title>
  <style>
    :root {
      --dark-wood: #4a2c2a;
      --belt-color: #333;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; position: fixed;
      background-color: #f7d2c4;
    }

    /* THE WORLD WRAPPER */
    #scroller {
      position: absolute;
      width: 100%; height: 100%;
      will-change: transform;
    }

    /* ENDLESS WALLPAPER */
    #bg-layer {
      position: absolute;
      width: 300%; height: 100%;
      background: url('IMG_2480.jpeg') repeat-x;
      background-size: contain;
      z-index: 1;
    }

    /* HONEYCOMB SHELVES (Repeated) */
    .honeycomb {
      position: absolute;
      width: 110px; height: 95px;
      background-color: var(--dark-wood);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      z-index: 50;
    }

    /* SUSHI BELT & FLOOR */
    #floor-layer {
      position: absolute;
      bottom: 0; width: 300%; height: 20%;
      background: #fff; border-top: 6px solid var(--dark-wood);
      display: flex; z-index: 100;
    }

    .tile { flex: 0 0 3.333%; height: 100%; background-size: cover; }
    .tile:nth-child(odd) { background-image: url('tile1.png'); }
    .tile:nth-child(even) { background-image: url('tile2.png'); }

    /* FLOATING TREATS ON THE BELT */
    .treat {
      position: absolute;
      bottom: 12%; font-size: 30px;
      z-index: 110;
    }

    /* THE CAT */
    .cat {
      position: fixed; /* Fixed to screen so world moves behind it */
      left: 50%; bottom: 20%;
      width: 100px; height: 100px;
      transform: translateX(-50%);
      transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 200;
      pointer-events: none;
    }
    .cat img { width: 100%; height: 100%; object-fit: contain; }

    /* CONTROLS */
    #ui {
      position: fixed; top: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 10px; z-index: 1000;
    }
    #move-controls {
      position: fixed; bottom: 25%; width: 100%;
      display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
      z-index: 1000;
    }
    button {
      padding: 15px; border-radius: 50%; border: 2px solid var(--dark-wood);
      background: white; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="scroller">
    <div id="bg-layer"></div>
    
    <div id="items">
      <div class="honeycomb" style="top: 20%; left: 20%;"></div>
      <div class="honeycomb" style="top: 45%; left: 80%;"></div>
      <div class="honeycomb" style="top: 20%; left: 120%;"></div>
      <div class="honeycomb" style="top: 45%; left: 180%;"></div>
      <div class="honeycomb" style="top: 20%; left: 220%;"></div>
      <div class="honeycomb" style="top: 45%; left: 280%;"></div>
    </div>

    <div class="treat" style="left: 15%;">🍣</div>
    <div class="treat" style="left: 45%;">🍤</div>
    <div class="treat" style="left: 75%;">🍙</div>
    <div class="treat" style="left: 115%;">🍣</div>
    <div class="treat" style="left: 145%;">🍤</div>
    <div class="treat" style="left: 175%;">🍙</div>

    <div id="floor-layer"></div>
  </div>

  <div class="cat" id="player-cat">
    <img src="mochi_idle.png" id="current-cat">
  </div>

  <div id="ui">
    <button onclick="swap('mochi_idle.png')">🐱</button>
    <button onclick="swap('jinx_idle.png')">🐈</button>
  </div>

  <div id="move-controls">
    <button onclick="scrollWorld(-15)">⬅️</button>
    <button onclick="jump()">🚀</button>
    <button onclick="scrollWorld(15)">➡️</button>
  </div>

  <script>
    let pos = 0;
    const scroller = document.getElementById('scroller');
    const floor = document.getElementById('floor-layer');

    // Populate Floor
    for(let i=0; i<30; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      floor.appendChild(t);
    }

    function scrollWorld(delta) {
      pos += delta;
      
      // Loop Logic: Reset after 100vw to create infinite effect
      if (pos > 100) pos = 0;
      if (pos < 0) pos = 100;

      scroller.style.transform = `translateX(-${pos}vw)`;
    }

    function jump() {
      const cat = document.getElementById('player-cat');
      cat.style.bottom = "50%";
      setTimeout(() => {
        cat.style.bottom = "20%";
      }, 600);
    }

    function swap(img) {
      document.getElementById('current-cat').src = img;
    }
  </script>
</body>
</html>
