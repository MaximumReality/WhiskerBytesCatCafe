<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisker Bytes Cafe</title>
  <style>
    :root {
      --brown: #6b3e2e;
      --shelf-color: rgba(255, 255, 255, 0.5);
    }

    /* Prevent scrolling/bouncing on iPhone */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
      background: #f7d2c4 url('IMG_2480.jpeg') repeat;
      background-size: 300px;
      animation: bgScroll 60s linear infinite;
    }

    @keyframes bgScroll {
      from { background-position: 0 0; }
      to { background-position: 300px 300px; }
    }

    /* The main play area */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 80%; /* Ends where floor begins */
      z-index: 10;
    }

    /* THE FLOOR: Built as a table for perfect iPhone alignment */
    #floor-table {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20%;
      border-collapse: collapse;
      background: white; /* Blocks wallpaper */
      border-top: 4px solid var(--brown);
      z-index: 100;
      table-layout: fixed;
    }

    #floor-table td {
      padding: 0;
      background-size: cover;
      background-position: center;
    }

    /* Checkerboard patterns */
    .type-a { background-image: url('tile1.png'); }
    .type-b { background-image: url('tile2.png'); }

    /* Interactive Elements */
    .shelf {
      position: absolute;
      background: var(--shelf-color);
      height: 12px;
      border-radius: 10px;
      border: 1px solid white;
      z-index: 20;
    }

    .cat {
      position: absolute;
      width: 80px; /* Smaller for iPhone screens */
      height: 80px;
      z-index: 150;
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .cat img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #controls {
      position: absolute;
      bottom: 22%;
      width: 90%;
      left: 5%;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      z-index: 200;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="stage">
    <div class="shelf" style="top: 20%; left: 10%; width: 100px;" onclick="jump('10%', '20%')"></div>
    <div class="shelf" style="top: 40%; left: 45%; width: 120px;" onclick="jump('45%', '40%')"></div>
    <div class="shelf" style="top: 60%; left: 20%; width: 100px;" onclick="jump('20%', '60%')"></div>

    <div id="active-cat" class="cat" style="left: 10%; top: 82%;">
      <img src="mochi_idle.png" id="cat-img">
    </div>
  </div>

  <table id="floor-table">
    <tr id="row1"></tr>
    <tr id="row2"></tr>
  </table>

  <div id="controls">
    <button onclick="changeCat('mochi_idle.png')">Mochi</button>
    <button onclick="changeCat('jinx_idle.png')">Jinx</button>
    <button onclick="jump('10%', '82%')">Floor</button>
  </div>

  <script>
    // Build the checkerboard floor
    const r1 = document.getElementById('row1');
    const r2 = document.getElementById('row2');
    
    for(let i=0; i<6; i++) { // 6 tiles wide is better for iPhone portrait
      r1.innerHTML += `<td class="${i%2==0 ? 'type-a' : 'type-b'}"></td>`;
      r2.innerHTML += `<td class="${i%2==0 ? 'type-b' : 'type-a'}"></td>`;
    }

    function jump(x, y) {
      const cat = document.getElementById('active-cat');
      cat.style.left = x;
      // Adjust y for cat height
      const yVal = parseFloat(y);
      cat.style.top = (yVal - 8) + "%";
    }

    function changeCat(imgSrc) {
      document.getElementById('cat-img').src = imgSrc;
    }
  </script>
</body>
</html>
