<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Professional Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; --gold: #ffd700; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay, #results-overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center; padding: 20px; }
  #logo-img { width: 150px; margin-bottom: 10px; border-radius: 10px; border: 2px solid var(--pink); }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; font-size: 12px; }
  .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; object-fit: contain; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 12px; line-height: 1.4; }
  #ui-top-right { position: fixed; top: 10px; right: 10px; z-index: 101; display: none; display: flex; gap: 5px; }
  .ui-btn { background: var(--pink); border: 2px solid white; border-radius: 5px; padding: 8px 12px; font-weight: bold; color: #4a2c2a; cursor: pointer; }

  #shop-menu { position: fixed; top: 0; right: -250px; width: 200px; height: 100%; background: white; border-left: 4px solid var(--wood); z-index: 2000; transition: 0.3s; padding: 20px; color: #4a2c2a; }
  #shop-menu.open { right: 0; }
  
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 5px; z-index: 500; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 20px; touch-action: manipulation; }
  
  .stars { color: var(--gold); font-size: 30px; margin: 10px 0; }
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" id="logo-img">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('luna')"><img src="luna_idle.png">LUNA</div>
    <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
    <div class="btn-select" onclick="startGame('gingerella')"><img src="gingerella_idle.png">GINGER</div>
  </div>
</div>

<div id="results-overlay" style="display:none;">
    <h1 id="res-day">DAY 1 COMPLETE</h1>
    <div class="stars" id="res-stars">⭐⭐⭐⭐⭐</div>
    <p>Friends Served: <span id="res-served">0</span></p>
    <p>Daily Profit: <span id="res-profit">0</span></p>
    <button class="ui-btn" onclick="nextDay()">START NEXT DAY ☀️</button>
</div>

<div id="ui-top-right" style="display:none;">
    <button class="ui-btn" onclick="toggleShop()">🛒 SHOP</button>
</div>

<div id="shop-menu">
    <h3>SHOP</h3>
    <p>Expand your cafe!</p>
    <button class="ui-btn" onclick="buyFurniture()">Buy Table (200)</button><br><br>
    <button class="ui-btn" onclick="toggleShop()">CLOSE</button>
</div>

<div id="stats">
    <b>DAY <span id="dayVal">1</span></b> | <span id="timeVal">9:00 AM</span><br>
    <b>⭐ <span id="scoreVal">0</span></b><br>
    <span id="holdingTxt" style="color:brown">Empty Paws</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
  <button class="ctrl-btn" style="background:var(--pink); width: 80px;" onclick="interact()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, gameState = "START", playerHolding = null;
let currentDay = 1, gameMinutes = 540, dayServed = 0, dayActive = false;

const catImg = new Image(), bgPattern = new Image();
const f1 = new Image(); f1.src = 'friend1.png';
const f2 = new Image(); f2.src = 'friend2.png';
const friendImages = [f1, f2];

const player = { x: 0, y: 0, speed: 5, facing: 1, naturalDir: 1, meowing: 0, catName: "" };
let furniture = [], customers = [];
const menu = ["☕", "🍪"];

function startGame(cat) {
  catImg.src = cat + "_idle.png";
  bgPattern.src = 'IMG_2480.jpeg'; 
  player.catName = cat;
  player.speed = (cat === 'gingerella') ? 8 : 5;
  player.naturalDir = (cat === 'mochi') ? 1 : -1;
  player.facing = player.naturalDir; 
  
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  document.getElementById('ui-top-right').style.display = 'flex';
  
  furniture = [
    { x: 80, y: 150, type: "COUNTER", emoji: "🏪", item: "☕" },
    { x: 160, y: 150, type: "COUNTER", emoji: "🏪", item: "🍪" },
    { x: canvas.width/2, y: canvas.height/2 + 50, type: "TABLE", emoji: "🟫", solid: true },
    { x: canvas.width/2 - 70, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑", occupied: false }, 
    { x: canvas.width/2 + 70, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑", occupied: false }
  ];
  
  dayActive = true;
  gameState = "PLAYING";
  spawnCustomer();
}

function updateClock() {
    if (!dayActive) return;
    gameMinutes += 0.4;
    let hours = Math.floor(gameMinutes / 60);
    let mins = Math.floor(gameMinutes % 60);
    let ampm = hours >= 12 ? 'PM' : 'AM';
    let dH = hours > 12 ? hours - 12 : hours;
    let dM = mins < 10 ? '0' + mins : mins;
    document.getElementById('timeVal').innerText = dH + ":" + dM + " " + ampm;

    if (hours >= 18) endDay();
}

function endDay() {
    dayActive = false;
    let starCount = Math.min(5, Math.ceil(dayServed / 2));
    if (dayServed === 0) starCount = 1;
    
    document.getElementById('res-day').innerText = "DAY " + currentDay + " COMPLETE";
    document.getElementById('res-stars').innerText = "⭐".repeat(starCount);
    document.getElementById('res-served').innerText = dayServed;
    document.getElementById('res-profit').innerText = dayServed * 50;
    document.getElementById('results-overlay').style.display = 'flex';
}

function nextDay() {
    currentDay++;
    gameMinutes = 540;
    dayServed = 0;
    dayActive = true;
    customers = [];
    furniture.forEach(f => { if(f.type === "CHAIR") f.occupied = false; });
    document.getElementById('dayVal').innerText = currentDay;
    document.getElementById('results-overlay').style.display = 'none';
    spawnCustomer();
}

function spawnCustomer() {
  if (!dayActive) return;
  const openChairs = furniture.filter(f => f.type === "CHAIR" && !f.occupied);
  if (openChairs.length > 0 && customers.length < openChairs.length) {
    const chair = openChairs[Math.floor(Math.random() * openChairs.length)];
    chair.occupied = true;
    customers.push({ 
        x: chair.x, y: chair.y - 15, chair: chair, 
        img: friendImages[Math.floor(Math.random() * friendImages.length)],
        order: menu[Math.floor(Math.random() * menu.length)]
    });
  }
}

function interact() {
  player.meowing = 30;
  furniture.forEach(f => {
    if(f.type === "COUNTER" && Math.abs(player.x - f.x) < 60 && Math.abs(player.y - f.y) < 60) {
      playerHolding = f.item;
      document.getElementById('holdingTxt').innerText = "Holding: " + playerHolding;
    }
  });
  customers.forEach((c, i) => {
    if(Math.abs(player.x - c.x) < 80 && Math.abs(player.y - c.y) < 80 && playerHolding === c.order) {
        score += 50; dayServed++; playerHolding = null;
        document.getElementById('holdingTxt').innerText = "Empty Paws";
        document.getElementById('scoreVal').innerText = score;
        c.chair.occupied = false; customers.splice(i, 1);
        setTimeout(spawnCustomer, 2000);
    }
  });
}

function toggleShop() { document.getElementById('shop-menu').classList.toggle('open'); }
function buyFurniture() {
    if (score >= 200) {
        score -= 200; document.getElementById('scoreVal').innerText = score;
        let nX = Math.random() * (canvas.width - 200) + 100, nY = Math.random() * (canvas.height - 300) + 200;
        furniture.push({ x: nX, y: nY, type: "TABLE", emoji: "🟫", solid: true });
        furniture.push({ x: nX - 70, y: nY, type: "CHAIR", emoji: "🪑", occupied: false });
        furniture.push({ x: nX + 70, y: nY, type: "CHAIR", emoji: "🪑", occupied: false });
        toggleShop();
    }
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

const keys = { up: false, down: false, left: false, right: false };
function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => { 
    e.preventDefault(); keys[k] = true; 
    if (k === 'left') player.facing = -1;
    if (k === 'right') player.facing = 1;
  };
  btn.ontouchend = () => { keys[k] = false; };
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

function update() {
  if (gameState !== "PLAYING" || !dayActive) return;
  updateClock();
  let nX = player.x, nY = player.y;
  if (keys.up) nY -= player.speed; if (keys.down) nY += player.speed;
  if (keys.left) nX -= player.speed; if (keys.right) nX += player.speed;
  let canMove = true;
  furniture.forEach(f => { if(f.solid && Math.abs(nX - f.x) < 50 && Math.abs(nY - f.y) < 50) canMove = false; });
  if(canMove) { player.x = nX; player.y = nY; }
  player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
  player.y = Math.max(120, Math.min(canvas.height - 110, player.y));
  if (Math.random() < 0.005) spawnCustomer();
}

function draw() {
  ctx.fillStyle = "#d2b48c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bgPattern, 0, 0, canvas.width, 90);
  ctx.font = "40px Arial";
  furniture.forEach(f => {
      ctx.fillText(f.emoji, f.x - 20, f.y + 15);
      if(f.type === "COUNTER") { ctx.font = "14px Arial"; ctx.fillText(f.item, f.x - 10, f.y - 25); ctx.font = "40px Arial"; }
  });
  customers.forEach(c => {
    ctx.drawImage(c.img, c.x - 45, c.y - 45, 90, 90);
    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x + 35, c.y - 35, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "black"; ctx.font = "16px Arial"; ctx.fillText(c.order, c.x + 27, c.y - 30);
  });
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.facing !== player.naturalDir) ctx.scale(-1, 1);
  ctx.drawImage(catImg, -45, -45, 90, 90);
  ctx.restore();
  
  if(player.meowing > 0) {
    ctx.font = "bold 14px Arial"; ctx.fillStyle = "white";
    ctx.fillText(player.catName === 'luna' ? "💖 MEOW! 💖" : "MEOW! 🐾", player.x - 40, player.y - 55);
    player.meowing--;
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
