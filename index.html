<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: MASTER EDITION</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; --gold: #ffd700; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #4a2c2a; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
    canvas { display: block; touch-action: none; background: #d2b48c; }
    
    /* MENUS */
    #overlay, #results-overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; color: white; text-align: center; }
    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; cursor: pointer; }
    .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; }
    
    #shop-menu { position: fixed; top: 0; right: -280px; width: 240px; height: 100%; background: white; border-left: 5px solid var(--wood); z-index: 4000; transition: 0.3s; padding: 20px; color: #4a2c2a; overflow-y: auto; }
    #shop-menu.open { right: 0; }
    .shop-item { border-bottom: 1px solid #ddd; padding: 10px 0; }

    /* UI */
    #stats { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 12px; }
    #ui-right { position: fixed; top: 10px; right: 10px; z-index: 1001; display: flex; gap: 5px; }
    .ui-btn { background: var(--pink); border: 2px solid white; border-radius: 5px; padding: 8px; font-weight: bold; color: #4a2c2a; cursor: pointer; }

    /* CONTROLS */
    #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 5px; z-index: 1000; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 24px; touch-action: manipulation; }
</style>
</head>
<body>

<div id="overlay">
    <h1>WHISKER BYTES</h1>
    <div id="high-score-board" style="font-size:12px; color:var(--pink); margin-bottom:10px;"></div>
    <div class="char-grid">
        <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI<br><small>MASTER CHEF</small></div>
        <div class="btn-select" onclick="startGame('gingerella')"><img src="ginger_idle.png">GINGER<br><small>SPEEDY</small></div>
        <div class="btn-select" onclick="startGame('luna')"><img src="luna_idle.png">LUNA<br><small>HOSTESS</small></div>
        <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX<br><small>MANAGER</small></div>
    </div>
</div>

<div id="shop-menu">
    <h3>CAT CAFE SHOP</h3>
    <div class="shop-item">
        <p>🟫 Extra Table (200)</p>
        <button class="ui-btn" onclick="buyFurniture()">BUY</button>
    </div>
    <div class="shop-item">
        <p>🥐 Bakery Pack (350)</p>
        <button class="ui-btn" id="btn-bakery" onclick="unlock('bakery', 350)">UNLOCK</button>
    </div>
    <div class="shop-item">
        <p>🍰 Sweets Pack (500)</p>
        <button class="ui-btn" id="btn-sweets" onclick="unlock('sweets', 500)">UNLOCK</button>
    </div>
    <br>
    <button class="ui-btn" style="width:100%; background:#ccc" onclick="toggleShop()">⬅ BACK</button>
    <button class="ui-btn" style="width:100%; background:#ff4444; color:white; margin-top:10px;" onclick="resetSave()">WIPE SAVE</button>
</div>

<div id="results-overlay" style="display:none;">
    <h1 id="res-day">DAY DONE</h1>
    <div id="res-stars" style="font-size:40px;">⭐⭐⭐</div>
    <p>Profit: <span id="res-profit">0</span></p>
    <button class="ui-btn" style="padding:15px 30px;" onclick="nextDay()">START NEXT DAY ☀️</button>
</div>

<div id="stats" style="display:none;">
    <b>DAY <span id="dayVal">1</span></b> | <span id="timeVal">9:00 AM</span><br>
    <b>⭐ <span id="scoreVal">0</span></b><br>
    <span id="holdingTxt" style="color:brown">Empty Paws</span>
</div>

<div id="ui-right" style="display:none;">
    <button class="ui-btn" onclick="toggleShop()">🛒 SHOP</button>
</div>

<canvas id="game"></canvas>

<div id="controls">
    <div class="d-pad">
        <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
        <button class="ctrl-btn" id="left">⬅️</button>
        <button class="ctrl-btn" id="down">⬇️</button>
        <button class="ctrl-btn" id="right">➡️</button>
    </div>
    <button class="ctrl-btn" id="action-btn" style="width:100px; background:var(--pink);" onclick="interact()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, currentDay = 1, gameMinutes = 540, dayServed = 0, dayActive = false;
let playerHolding = null, gameState = "START", weather = "SUNNY", unlocked = ["☕", "🍪", "🍼"];
let vibes = [{f:"#d2b48c", t:"rgba(0,0,0,0)"}, {f:"#f7d2c4", t:"rgba(255,192,203,0.1)"}, {f:"#4a4e69", t:"rgba(0,0,50,0.3)"}];
let currentVibe = 0, pawPrints = [], criticActive = false;

const catImg = new Image(), bgImg = new Image();
const f1 = new Image(); f1.src = 'friend1.png';
const f2 = new Image(); f2.src = 'friend2.png';
const criticImg = new Image(); criticImg.src = 'critic.png';
const friendImgs = [f1, f2];

const player = { x: 100, y: 300, speed: 5, facing: 1, name: "", meow: 0, boost: 0, cookTime: 60 };
let furniture = [], customers = [];
const keys = {up:0, down:0, left:0, right:0};

function startGame(cat) {
    player.name = cat;
    catImg.src = cat + "_idle.png";
    bgImg.src = 'IMG_2480.jpeg';
    player.speed = (cat === 'gingerella') ? 8 : 5;
    player.cookTime = (cat === 'mochi') ? 35 : 60;
    
    furniture = [
        {x:60, y:150, type:"COUNTER", item:"☕", e:"🏪"},
        {x:120, y:150, type:"COUNTER", item:"🍪", e:"🏪"},
        {x:180, y:150, type:"COUNTER", item:"🍼", e:"🏪"},
        {x:300, y:150, type:"RADIO", e:"📻"},
        {x:canvas.width-60, y:canvas.height-60, type:"BED", e:"🛏️"},
        {x:canvas.width/2, y:canvas.height/2+50, type:"TABLE", e:"🟫", solid:true},
        {x:canvas.width/2-60, y:canvas.height/2+50, type:"CHAIR", e:"🪑"},
        {x:canvas.width/2+60, y:canvas.height/2+50, type:"CHAIR", e:"🪑"}
    ];
    
    load();
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('stats').style.display = 'block';
    document.getElementById('ui-right').style.display = 'flex';
    dayActive = true; gameState = "PLAYING";
    loop();
}

let kitchen = { active: false, t: 0, item: null };

function interact() {
    if(kitchen.active) return;
    player.meow = 30;
    
    furniture.forEach(f => {
        let d = Math.hypot(player.x-f.x, player.y-f.y);
        if(d < 60) {
            if(f.type === "COUNTER" && !playerHolding) {
                kitchen.active = true; kitchen.t = player.cookTime; kitchen.item = f.item;
            }
            if(f.type === "RADIO") currentVibe = (currentVibe+1)%vibes.length;
            if(f.type === "BED") { player.boost = 600; player.meow = 50; }
        }
    });

    customers.forEach((c, i) => {
        if(Math.hypot(player.x-c.x, player.y-c.y) < 70 && playerHolding === c.order) {
            let tip = (gameMinutes - c.entry < 60) ? 20 : 0;
            score += (c.isCritic ? 500 : 50 + tip);
            dayServed += (c.isCritic ? 5 : 1);
            playerHolding = null; 
            c.chair.occupied = false; 
            customers.splice(i, 1);
            if(c.isCritic) criticActive = false;
            document.getElementById('holdingTxt').innerText = "Empty Paws";
            document.getElementById('scoreVal').innerText = score;
        }
    });
}

function update() {
    if(!dayActive) return;
    gameMinutes += 0.35;
    if(gameMinutes >= 1080) endDay();
    
    let h = Math.floor(gameMinutes/60), m = Math.floor(gameMinutes%60);
    document.getElementById('timeVal').innerText = (h>12?h-12:h)+":"+(m<10?'0'+m:m)+(h>=12?'PM':'AM');

    // Movement
    if(!kitchen.active) {
        let spd = player.boost > 0 ? player.speed * 1.5 : player.speed;
        let nx = player.x, ny = player.y;
        if(keys.up) ny -= spd; if(keys.down) ny += spd;
        if(keys.left) { nx -= spd; player.facing = -1; }
        if(keys.right) { nx += spd; player.facing = 1; }
        
        let wall = furniture.find(f => f.solid && Math.hypot(nx-f.x, ny-f.y) < 50);
        if(!wall) { player.x = nx; player.y = ny; }
        if(keys.up||keys.down||keys.left||keys.right) {
            if(Math.random()<0.1) pawPrints.push({x:player.x, y:player.y+20, a:1});
        }
    }

    if(kitchen.active) {
        kitchen.t--;
        if(kitchen.t <= 0) { playerHolding = kitchen.item; kitchen.active = false; document.getElementById('holdingTxt').innerText = "Holding: "+playerHolding; }
    }
    
    if(player.boost > 0) player.boost--;
    if(Math.random() < 0.005) spawnCustomer();
    if(Math.random() < 0.001) spawnCritic();

    let near = customers.some(c => Math.hypot(player.x-c.x, player.y-c.y) < 70);
    document.getElementById('action-btn').innerText = near ? "📝" : "📢";
}

function draw() {
    let v = vibes[currentVibe];
    ctx.fillStyle = v.f; ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(bgImg, 0,0, canvas.width, 90);
    
    // Windows
    for(let i=1; i<4; i++) {
        ctx.fillStyle = "#5d4037"; ctx.fillRect((canvas.width/4)*i-45, 35, 90, 50);
        ctx.fillStyle = weather === "RAINY" ? "#4a90e2" : "#87ceeb"; ctx.fillRect((canvas.width/4)*i-40, 40, 80, 40);
    }

    pawPrints.forEach((p, i) => {
        ctx.globalAlpha = p.a; ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
        p.a -= 0.01; if(p.a <=0) pawPrints.splice(i,1);
    });
    ctx.globalAlpha = 1;

    ctx.font = "40px Arial";
    furniture.forEach(f => {
        ctx.fillText(f.e, f.x-20, f.y+15);
        if(f.type === "COUNTER") { ctx.font="12px Arial"; ctx.fillText(f.item, f.x-10, f.y-25); ctx.font="40px Arial"; }
    });

    customers.forEach(c => {
        ctx.drawImage(c.isCritic ? criticImg : c.img, c.x-40, c.y-40, 80, 80);
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x+30, c.y-30, 15, 0, 7); ctx.fill();
        ctx.fillStyle="black"; ctx.font="14px Arial"; ctx.fillText(c.order, c.x+24, c.y-26);
    });

    ctx.save(); ctx.translate(player.x, player.y);
    if(player.facing === -1) ctx.scale(-1,1);
    ctx.drawImage(catImg, -45, -45, 90, 90); ctx.restore();

    if(kitchen.active) {
        ctx.fillStyle="white"; ctx.fillRect(player.x-20, player.y-60, 40, 5);
        ctx.fillStyle="#ffc0cb"; ctx.fillRect(player.x-20, player.y-60, (1-kitchen.t/player.cookTime)*40, 5);
    }
    
    ctx.fillStyle = v.t; ctx.fillRect(0,0,canvas.width, canvas.height);
}

function spawnCustomer() {
    let chair = furniture.find(f => f.type === "CHAIR" && !f.occupied);
    if(chair) {
        chair.occupied = true;
        let fIdx = Math.floor(Math.random()*2);
        let ord = (fIdx === 1) ? (Math.random()<0.7?"🍼":unlocked[0]) : unlocked[Math.floor(Math.random()*unlocked.length)];
        customers.push({x:chair.x, y:chair.y-15, chair:chair, img:friendImgs[fIdx], order:ord, entry:gameMinutes});
    }
}

function spawnCritic() {
    if(criticActive) return;
    let chair = furniture.find(f => f.type === "CHAIR" && !f.occupied);
    if(chair) {
        chair.occupied = true; criticActive = true;
        customers.push({x:chair.x, y:chair.y-15, chair:chair, order:"🍰", isCritic:true, entry:gameMinutes});
    }
}

function toggleShop() { document.getElementById('shop-menu').classList.toggle('open'); }
function buyFurniture() {
    if(score >= 200) {
        score -= 200; 
        let x = 100+Math.random()*(canvas.width-200), y = 200+Math.random()*(canvas.height-300);
        furniture.push({x:x, y:y, type:"TABLE", e:"🟫", solid:true}, {x:x-60, y:y, type:"CHAIR", e:"🪑"}, {x:x+60, y:y, type:"CHAIR", e:"🪑"});
        save();
    }
}

function unlock(type, cost) {
    if(score >= cost) {
        score -= cost;
        if(type === 'bakery') { unlocked.push("🥐","🥯","🥨"); furniture.push({x:360, y:150, type:"COUNTER", item:"🥐", e:"🏪"}); }
        if(type === 'sweets') { unlocked.push("🍰","🧁","🍩"); furniture.push({x:420, y:150, type:"COUNTER", item:"🍰", e:"🏪"}); }
        save(); toggleShop();
    }
}

function endDay() {
    dayActive = false; save();
    document.getElementById('res-stars').innerText = "⭐".repeat(Math.min(5, Math.ceil(dayServed/2) || 1));
    document.getElementById('res-profit').innerText = dayServed * 50;
    document.getElementById('results-overlay').style.display = 'flex';
}

function nextDay() {
    currentDay++; gameMinutes = 540; dayServed = 0; dayActive = true; customers = [];
    furniture.forEach(f => { if(f.type === "CHAIR") f.occupied = false; });
    document.getElementById('dayVal').innerText = currentDay;
    document.getElementById('results-overlay').style.display = 'none';
}

function save() {
    let data = {s:score, d:currentDay, f:furniture.filter(f=>f.type==="TABLE").length, u:unlocked};
    localStorage.setItem('whisker_v4', JSON.stringify(data));
    document.getElementById('scoreVal').innerText = score;
}

function load() {
    let d = JSON.parse(localStorage.getItem('whisker_v4'));
    if(d) {
        score = d.s; currentDay = d.d; unlocked = d.u;
        for(let i=1; i<d.f; i++) buyFurniture();
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('dayVal').innerText = currentDay;
    }
}

function resetSave() { localStorage.clear(); location.reload(); }

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

function bind(id, k) {
    let b = document.getElementById(id);
    b.ontouchstart = (e) => { e.preventDefault(); keys[k] = 1; };
    b.ontouchend = () => keys[k] = 0;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

function loop() { update(); draw(); requestAnimationFrame(loop); }
</script>
</body>
</html>
