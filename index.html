<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Cafe Mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', Courier, monospace; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(107, 62, 46, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; color: white; }
  .title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; color: #ffc0cb; text-shadow: 2px 2px #4a2c2a; }
  .char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .char-btn { background: #fff; border: 3px solid #6b3e2e; border-radius: 15px; padding: 10px; cursor: pointer; color: #6b3e2e; }
  .char-btn img { width: 60px; height: 60px; object-fit: contain; }
  #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; background: #4a2c2a; display: none; justify-content: center; align-items: center; gap: 20px; z-index: 100; }
  button { font-size: 30px; width: 70px; height: 70px; border-radius: 15px; border: none; background: white; touch-action: manipulation; }
  #stats { position: fixed; top: 10px; left: 20px; font-size: 20px; color: #4a2c2a; font-weight: bold; z-index: 100; display: none; }
</style>
</head>
<body>

<div id="overlay">
  <div class="title">WHISKER BYTES</div>
  <p>SELECT YOUR CAT</p>
  <div class="char-grid">
    <div class="char-btn" onclick="selectChar('mochi')"><img src="mochi_idle.png"><p>Mochi</p></div>
    <div class="char-btn" onclick="selectChar('jinx')"><img src="jinx_idle.png"><p>Jinx</p></div>
  </div>
</div>

<div id="stats">SUSHI COLLECTED: <span id="scoreVal">0</span></div>
<canvas id="game"></canvas>

<div id="controls">
  <button id="left">⬅️</button>
  <button id="jump">⬆️</button>
  <button id="right">➡️</button>
  <button onclick="location.reload()">🎬</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "START", cameraX = 0, score = 0;
const worldWidth = 3000;
const ROAD_H = 100; 
let groundY;

const catImg = new Image();
function selectChar(cat) {
  catImg.src = cat + "_idle.png";
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  gameState = "PLAY";
}

// Background Pattern
const bgPattern = new Image();
bgPattern.src = 'IMG_2480.jpeg';

// Generate Designer Layout
const honeycombs = Array.from({length: 10}, () => ({ x: Math.random() * worldWidth, y: 150 + Math.random() * 200 }));
const sushi = Array.from({length: 15}, () => ({ x: Math.random() * worldWidth, type: ["🍣","🍤","🍙"][Math.floor(Math.random()*3)], collected: false }));

const player = { x: 500, y: 0, vy: 0, jumping: false, dir: 1, speed: 6 };

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  groundY = canvas.height - ROAD_H - 100;
  player.y = groundY;
}
window.addEventListener("resize", resize); resize();

let keys = { left: false, right: false, jump: false };
function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
  btn.ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
}
bind("left", "left"); bind("right", "right"); bind("jump", "jump");

function update() {
  if (gameState !== "PLAY") return;

  if (keys.left) { player.x -= player.speed; player.dir = -1; }
  if (keys.right) { player.x += player.speed; player.dir = 1; }
  
  // Jump logic
  if (keys.jump && !player.jumping) { player.vy = -18; player.jumping = true; }
  player.vy += 0.8; 
  player.y += player.vy;

  if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; }

  // Loop world
  if (player.x < 0) player.x = worldWidth;
  if (player.x > worldWidth) player.x = 0;

  // Sushi collection
  sushi.forEach(s => {
    if(!s.collected && Math.abs(player.x - s.x) < 40 && Math.abs(player.y - groundY) < 50) {
      s.collected = true; score++;
      document.getElementById('scoreVal').innerText = score;
    }
  });

  cameraX = player.x - canvas.width / 2;
}

function drawHex(x, y) {
  ctx.fillStyle = "#4a2c2a";
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    ctx.lineTo(x + 50 * Math.cos(i * Math.PI / 3), y + 50 * Math.sin(i * Math.PI / 3));
  }
  ctx.closePath(); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (gameState === "START") return;

  // Draw Background (Seamless Loop)
  const bgX = -(cameraX * 0.5) % canvas.width;
  ctx.drawImage(bgPattern, bgX, 0, canvas.width, canvas.height);
  ctx.drawImage(bgPattern, bgX + canvas.width, 0, canvas.width, canvas.height);

  // Draw Floor
  ctx.fillStyle = "white";
  ctx.fillRect(0, groundY + 80, canvas.width, 200);
  ctx.strokeStyle = "#4a2c2a"; ctx.lineWidth = 5;
  ctx.strokeRect(-10, groundY + 80, canvas.width + 20, 5);

  // Draw Items (relative to camera)
  honeycombs.forEach(h => drawHex(h.x - cameraX, h.y));
  sushi.forEach(s => {
    if(!s.collected) {
      ctx.font = "30px serif";
      ctx.fillText(s.type, s.x - cameraX, groundY + 70);
    }
  });

  // Draw Player
  ctx.save();
  if (player.dir === -1) { ctx.translate(player.x - cameraX + 40, 0); ctx.scale(-1, 1); ctx.drawImage(catImg, 0, player.y, 80, 80); }
  else { ctx.drawImage(catImg, player.x - cameraX - 40, player.y, 80, 80); }
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
