<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisker Bytes: Zellige Lounge</title>
  <style>
    :root {
      --pink: #ffc0cb;
      --brown: #6b3e2e;
      --mochi-blue: #00f2ff;
      --jinx-amber: #ffaa00;
      --shelf-color: rgba(255, 255, 255, 0.25);
    }

    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: #f7d2c4 url('IMG2480.JPEG') no-repeat center center;
      background-size: cover;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Moroccan Tiled Floor */
    #floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 18%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(2, 1fr);
      border-top: 3px solid var(--brown);
      z-index: 5;
    }

    .tile { width: 100%; height: 100%; background-size: cover; }
    .tile:nth-child(odd) { background-image: url('tile1.PNG'); }
    .tile:nth-child(even) { background-image: url('tile2.PNG'); }

    header {
      background: rgba(107, 62, 46, 0.85);
      backdrop-filter: blur(8px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    #game-stage {
      position: relative;
      flex-grow: 1;
      width: 100%;
    }

    /* Interactive Shelves */
    .shelf {
      position: absolute;
      background: var(--shelf-color);
      backdrop-filter: blur(5px);
      height: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.4);
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }
    .shelf:hover { background: rgba(255,255,255,0.5); transform: translateY(-3px); }

    /* Cat Sprites & Sleep States */
    .cat-sprite {
      position: absolute;
      width: 110px;
      height: 110px;
      z-index: 20;
      transition: left 1.2s ease-in-out, top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .cat-sprite img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: breathe 3s infinite ease-in-out;
      transition: filter 1s ease;
    }

    .cat-sprite.sleeping img { filter: grayscale(0.6) brightness(0.6); }
    .cat-sprite.sleeping .eyes-glow { opacity: 0; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Glow overlays */
    .eyes-glow { 
      position: absolute; 
      width: 100%; 
      display: flex; 
      justify-content: space-around; 
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .eye-point { width: 8px; height: 8px; border-radius: 50%; filter: blur(2px); }
    
    .mochi .eyes-glow { top: 35%; padding: 0 32px; }
    .jinx .eyes-glow { top: 25%; padding: 0 42px; }
    .luna .eyes-glow { top: 45%; padding: 0 28px; }
    .gingerella .eyes-glow { top: 40%; padding: 0 32px; }

    .mochi .eye-point { background: var(--mochi-blue); box-shadow: 0 0 12px var(--mochi-blue); }
    .jinx .eye-point { background: var(--jinx-amber); box-shadow: 0 0 12px var(--jinx-amber); }

    #toy-box {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      padding: 10px 25px;
      border-radius: 50px;
      border: 3px solid var(--brown);
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .toy { font-size: 2.2rem; cursor: grab; transition: transform 0.2s; }
    .toy:hover { transform: scale(1.2); }

    /* Order Notification */
    #order-bubble {
      position: fixed;
      top: 80px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 20px;
      border: 3px solid var(--pink);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      z-index: 150;
      display: none;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h2 style="margin:0;">Whisker Bytes: Zellige Lounge</h2>
    <button onclick="togglePhoto()" style="padding:8px 15px; border-radius:20px; border:none; background:var(--pink); cursor:pointer; font-weight:bold;">📸 Photo Mode</button>
  </header>

  <div id="order-bubble">
    <strong>🛎️ New Order:</strong><br>
    <span id="order-text">Serve Mochi a fish!</span>
  </div>

  <div id="game-stage">
    <div class="shelf" style="top: 18%; left: 8%; width: 160px;" onclick="moveCat(8, 18)"></div>
    <div class="shelf" style="top: 42%; left: 40%; width: 220px;" onclick="moveCat(40, 42)"></div>
    <div class="shelf" style="top: 22%; left: 72%; width: 190px;" onclick="moveCat(72, 22)"></div>
    <div class="shelf" style="top: 58%; left: 78%; width: 150px;" onclick="moveCat(78, 58)"></div>

    <div id="mochi" class="cat-sprite mochi" style="left: 15%; top: 72%;" onclick="wakeAndSelect('mochi')">
      <img src="mochi_idle.png" alt="Mochi" onerror="this.src='https://via.placeholder.com/100?text=Mochi'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
    </div>

    <div id="jinx" class="cat-sprite jinx" style="left: 35%; top: 72%;" onclick="wakeAndSelect('jinx')">
      <img src="jinx_idle.png" alt="Jinx" onerror="this.src='https://via.placeholder.com/100?text=Jinx'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
    </div>

    <div id="luna" class="cat-sprite luna" style="left: 55%; top: 72%;" onclick="wakeAndSelect('luna')">
      <img src="luna_idle.png" alt="Luna" onerror="this.src='https://via.placeholder.com/100?text=Luna'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
    </div>

    <div id="gingerella" class="cat-sprite gingerella" style="left: 75%; top: 72%;" onclick="wakeAndSelect('gingerella')">
      <img src="gingerella_idle.png" alt="Ginger" onerror="this.src='https://via.placeholder.com/100?text=Ginger'">
      <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
    </div>
  </div>

  <div id="floor"></div>

  <div id="toy-box">
    <div class="toy" draggable="true" ondragstart="drag(event)" id="laser">🔴</div>
    <div class="toy" draggable="true" ondragstart="drag(event)" id="fish">🐟</div>
    <div id="status" style="font-size: 0.85rem; font-weight: bold; color: var(--brown);">Select a cat to begin!</div>
  </div>

  <script>
    let selectedCat = null;
    let sleepTimers = {};
    let gravityTimers = {};
    let currentOrder = null;

    // Generate Floor Tiles
    const floor = document.getElementById('floor');
    for (let i = 0; i < 40; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      floor.appendChild(tile);
    }

    function wakeAndSelect(id) {
      selectedCat = id;
      const cat = document.getElementById(id);
      cat.classList.remove('sleeping');
      document.getElementById('status').innerText = "Active: " + id.toUpperCase();
      startSleepTimer(id);
    }

    function moveCat(x, y) {
      if (!selectedCat) return;
      const cat = document.getElementById(selectedCat);
      cat.style.left = x + "%";
      cat.style.top = (y - 12) + "%"; 
      clearTimeout(gravityTimers[selectedCat]);
      gravityTimers[selectedCat] = setTimeout(() => goHome(selectedCat), 30000);
      startSleepTimer(selectedCat);
    }

    function goHome(id) {
      const cat = document.getElementById(id);
      cat.style.top = "72%";
      startSleepTimer(id);
    }

    function startSleepTimer(id) {
      clearTimeout(sleepTimers[id]);
      sleepTimers[id] = setTimeout(() => {
        const cat = document.getElementById(id);
        if (cat.style.top === "72%") cat.classList.add('sleeping');
      }, 45000);
    }

    // Drag and Drop Logic
    function drag(ev) { ev.dataTransfer.setData("toy", ev.target.id); }

    document.getElementById('game-stage').ondragover = (e) => e.preventDefault();
    document.getElementById('game-stage').ondrop = (e) => {
      e.preventDefault();
      const toy = e.dataTransfer.getData("toy");
      if (selectedCat) {
        document.getElementById('status').innerText = selectedCat.toUpperCase() + " loved the " + toy + "!";
        if (currentOrder && currentOrder === selectedCat && toy === "fish") {
          document.getElementById('status').innerText = "✅ Order Complete! Bonus Purrs!";
          document.getElementById('order-bubble').style.display = 'none';
          currentOrder = null;
        }
        wakeAndSelect(selectedCat);
      }
    };

    // Orders Feature
    function spawnOrder() {
      const cats = ['mochi', 'jinx', 'luna', 'gingerella'];
      currentOrder = cats[Math.floor(Math.random() * cats.length)];
      document.getElementById('order-text').innerText = "Serve " + currentOrder.toUpperCase() + " a fish!";
      document.getElementById('order-bubble').style.display = 'block';
    }
    setInterval(spawnOrder, 60000); // Every minute

    function togglePhoto() {
      document.getElementById('toy-box').classList.toggle('hidden');
      document.getElementById('order-bubble').classList.toggle('hidden');
      document.querySelectorAll('.shelf').forEach(s => s.classList.toggle('hidden'));
    }

    ['mochi', 'jinx', 'luna', 'gingerella'].forEach(id => startSleepTimer(id));
  </script>
</body>
</html>
