<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisker Bytes: Side-Scroller</title>
  <style>
    :root {
      --brown: #6b3e2e;
      --shelf-color: rgba(255, 255, 255, 0.4);
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; position: fixed;
      background-color: #f7d2c4;
    }

    /* THE CAMERA: A window that hides the extra width */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow-x: auto; /* Allows side-scrolling on iPhone */
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* THE ROOM: Twice as wide as the screen */
    #room {
      width: 200vw; 
      height: 100%;
      background-image: url('IMG_2480.jpeg');
      background-repeat: repeat-x;
      background-size: contain;
      position: relative;
    }

    /* MOBILE-SAFE FLOOR: Also 200% wide */
    #floor-scroll {
      position: absolute;
      bottom: 0;
      width: 200vw;
      height: 20%;
      background: white;
      border-top: 5px solid var(--brown);
      display: flex;
    }

    .tile {
      flex: 0 0 10%; /* 10% of viewport width per tile */
      height: 100%;
      background-size: cover;
    }

    .tile:nth-child(odd) { background-image: url('tile1.png'); }
    .tile:nth-child(even) { background-image: url('tile2.png'); }

    /* Interactive Elements */
    .shelf {
      position: absolute;
      background: var(--shelf-color);
      height: 14px;
      border-radius: 15px;
      border: 1px solid white;
      z-index: 20;
    }

    .cat {
      position: absolute;
      width: 100px;
      height: 100px;
      z-index: 150;
      transition: all 0.6s ease-out;
    }

    .cat img { width: 100%; height: 100%; object-fit: contain; }

    /* UI locked to the screen, not the scrolling room */
    #ui-fixed {
      position: fixed;
      bottom: 22%;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 1000;
    }

    button {
      padding: 10px 15px;
      border-radius: 20px;
      border: 2px solid var(--brown);
      background: rgba(255,255,255,0.9);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="viewport">
    <div id="room">
      <div class="shelf" style="top: 25%; left: 10%; width: 150px;" onclick="pounce('10%', '25%')"></div>
      <div class="shelf" style="top: 50%; left: 30%; width: 150px;" onclick="pounce('30%', '50%')"></div>
      
      <div class="shelf" style="top: 20%; left: 110%; width: 150px;" onclick="pounce('110%', '20%')"></div>
      <div class="shelf" style="top: 45%; left: 150%; width: 150px;" onclick="pounce('150%', '45%')"></div>

      <div id="main-cat" class="cat" style="left: 15%; top: 78%;">
        <img src="mochi_idle.png" id="cat-img">
      </div>

      <div id="floor-scroll">
        </div>
    </div>
  </div>

  <div id="ui-fixed">
    <button onclick="scrollToArea(0)">Left Side</button>
    <button onclick="scrollToArea(1)">Right Side</button>
    <button onclick="pounce('50%', '78%')">Down 🐾</button>
  </div>

  <script>
    // Create tiles for the 200% width floor
    const floor = document.getElementById('floor-scroll');
    for(let i=0; i<20; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      floor.appendChild(t);
    }

    function pounce(x, y) {
      const cat = document.getElementById('main-cat');
      cat.style.left = x;
      cat.style.top = (parseInt(y) - 10) + "%";
    }

    function scrollToArea(side) {
      const view = document.getElementById('viewport');
      const width = window.innerWidth;
      view.scrollTo({
        left: side * width,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
