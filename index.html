<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Endless Cafe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --dark-wood: #4a2c2a; --pink: #ffc0cb; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', Courier, monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center; }
  #logo-img { width: 220px; margin-bottom: 20px; border-radius: 10px; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: var(--dark-wood); font-weight: bold; font-size: 14px; }
  .btn-select img { width: 70px; height: 70px; object-fit: contain; display: block; margin: 0 auto 5px; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; color: var(--dark-wood); }
  #meter-wrap { width: 120px; height: 12px; background: rgba(0,0,0,0.1); border: 2px solid var(--dark-wood); border-radius: 10px; overflow: hidden; }
  #sushi-bar { width: 0%; height: 100%; background: var(--pink); transition: width 0.3s; }

  #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background: var(--dark-wood); display: none; justify-content: space-around; align-items: center; z-index: 500; }
  .ctrl-btn { width: 60px; height: 60px; border-radius: 12px; border: none; background: white; font-size: 24px; touch-action: manipulation; }
  #meow-btn { background: var(--pink); }
  #msg-box { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: white; border: 2px solid var(--dark-wood); padding: 8px 15px; border-radius: 20px; display: none; font-weight: bold; color: var(--dark-wood); z-index: 600; font-size: 12px; text-align: center;}
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" id="logo-img">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
  </div>
</div>

<div id="stats">
  <b>SUSHI: <span id="scoreVal">0</span></b>
  <div id="meter-wrap"><div id="sushi-bar"></div></div>
</div>
<div id="msg-box"></div>

<canvas id="game"></canvas>

<div id="controls">
  <button class="ctrl-btn" id="btn-left">⬅️</button>
  <button class="ctrl-btn" id="btn-jump">⬆️</button>
  <button class="ctrl-btn" id="btn-right">➡️</button>
  <button class="ctrl-btn" id="meow-btn" onclick="meow()">📢</button>
  <button class="ctrl-btn" onclick="saveGame()">💾</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let groundY, cameraX = 0, score = 0, gameState = "START", worldWidth = 3500;
let bgPattern = new Image();
const catImg = new Image();

let honeycombs = [], sushi = [], ghostTrail = [];
const player = { x: 400, y: 0, vy: 0, jumping: false, dir: 1, speed: 7, dashTimer: 0, jumpCount: 0, meowTimer: 0 };
const npc = { x: 1500, y: 0, timer: 0, done: false, msg: "Waiting for treats..." };

let keys = { left: false, right: false, jump: false };
let lastTap = { dir: null, time: 0 };

function startGame(cat) {
  catImg.src = cat + "_idle.png";
  bgPattern.src = 'IMG_2480.jpeg';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  gameState = "CAFE";
  initWorld();
}

function initWorld() {
  honeycombs = Array.from({length: 12}, (_, i) => ({ x: 400 + (i * 400), y: 250 + Math.random() * 200 }));
  sushi = Array.from({length: 15}, () => ({ x: Math.random() * worldWidth, type: ["🍣","🍤","🍙"][Math.floor(Math.random()*3)], collected: false }));
  npc.y = 350; // Align with platforms
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  groundY = canvas.height - 180;
  player.y = groundY;
}
window.addEventListener("resize", resize); resize();

function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => {
    e.preventDefault(); keys[k] = true;
    let now = Date.now();
    if(k === lastTap.dir && (now - lastTap.time) < 250) player.dashTimer = 15;
    lastTap = { dir: k, time: now };
  };
  btn.ontouchend = () => { keys[k] = false; };
}
bind("btn-left", "left"); bind("btn-right", "right"); bind("btn-jump", "jump");

function meow() {
  player.meowTimer = 60;
  if(Math.abs(player.x - npc.x) < 200) npc.timer += 40;
}

function update() {
  if (gameState === "START") return;

  let speed = (player.dashTimer > 0) ? 18 : player.speed;
  if (player.dashTimer > 0) {
    player.dashTimer--;
    ghostTrail.push({x: player.x, y: player.y, dir: player.dir, a: 0.6});
  }
  if (ghostTrail.length > 8) ghostTrail.shift();
  ghostTrail.forEach(g => { g.a -= 0.05; });

  if (keys.left) { player.x -= speed; player.dir = -1; }
  if (keys.right) { player.x += speed; player.dir = 1; }
  
  if (keys.jump) {
    if (!player.jumping) { player.vy = -17; player.jumping = true; player.jumpCount = 1; }
    else if (player.jumpCount === 1) { player.vy = -14; player.jumpCount = 2; }
    keys.jump = false;
  }
  player.vy += 0.8; player.y += player.vy;
  if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; player.jumpCount = 0; }

  if (player.x < 0) player.x = worldWidth;
  if (player.x > worldWidth) player.x = 0;

  cameraX = player.x - canvas.width / 2;

  sushi.forEach(s => {
    if(!s.collected && Math.abs(player.x - s.x) < 40 && Math.abs(player.y - groundY) < 50) {
      s.collected = true; score++; updateUI();
    }
  });

  if(Math.abs(player.x - npc.x) < 150 && Math.abs(player.y - npc.y) < 100 && !npc.done) {
    npc.timer++;
    if(npc.timer >= 180) { npc.done = true; score += 10; updateUI(); }
  }

  if(score >= 30 && gameState === "CAFE") {
    let msg = document.getElementById('msg-box');
    msg.style.display = "block";
    msg.innerText = "ADOPTION OFFICE UNLOCKED! RUN TO THE END ➡️";
    if(player.x > worldWidth - 200) enterAdoption();
  }
}

function updateUI() {
  document.getElementById('scoreVal').innerText = score;
  document.getElementById('sushi-bar').style.width = Math.min((score/30)*100, 100) + "%";
}

function enterAdoption() {
  gameState = "ADOPTION";
  bgPattern.src = 'IMG_2475.jpeg';
  player.x = 200;
  document.getElementById('msg-box').innerText = "ADOPTION OFFICE: PURR FOR THE AGENT!";
}

function draw() {
  ctx.fillStyle = "#f7d2c4"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // BG Parallax
  let bgX = -(cameraX * 0.4) % canvas.width;
  ctx.drawImage(bgPattern, bgX, 0, canvas.width, canvas.height);
  ctx.drawImage(bgPattern, bgX + canvas.width, 0, canvas.width, canvas.height);

  // Floor
  ctx.fillStyle = "white"; ctx.fillRect(0, groundY + 80, canvas.width, 300);
  ctx.strokeStyle = "#4a2c2a"; ctx.lineWidth = 4;
  ctx.strokeRect(-5, groundY + 80, canvas.width + 10, 2);

  // Honeycombs
  honeycombs.forEach(h => {
    ctx.save(); ctx.translate(h.x - cameraX, h.y);
    ctx.fillStyle = "#4a2c2a"; ctx.beginPath();
    for(let i=0; i<6; i++) ctx.lineTo(50*Math.cos(i*Math.PI/3), 50*Math.sin(i*Math.PI/3));
    ctx.closePath(); ctx.fill(); ctx.restore();
  });

  // Sushi
  ctx.font = "30px Arial";
  sushi.forEach(s => { if(!s.collected) ctx.fillText(s.type, s.x - cameraX - 15, groundY + 70); });

  // NPC (The "Floating Head" fix - added a body!)
  ctx.font = "40px Arial";
  let nx = npc.x - cameraX;
  ctx.fillText("👩‍🦱", nx - 20, npc.y); 
  ctx.fillText("👗", nx - 20, npc.y + 40); // Added a "body" emoji so she's not just a head

  if(npc.timer > 0 && !npc.done) {
    ctx.strokeStyle = "pink"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(nx, npc.y - 40, 20, 0, (npc.timer/180)*Math.PI*2);
    ctx.stroke();
  }

  // Cat Render (Ghost + Main)
  [...ghostTrail, {x: player.x, y: player.y, dir: player.dir, a: 1}].forEach(p => {
    ctx.save(); ctx.globalAlpha = p.a;
    ctx.translate(p.x - cameraX, p.y);
    if(p.dir === -1) ctx.scale(-1, 1);
    ctx.drawImage(catImg, -45, 0, 90, 90);
    ctx.restore();
  });

  if(player.meowTimer > 0) {
    player.meowTimer--;
    ctx.fillStyle = "white"; ctx.font = "bold 12px Arial";
    ctx.fillText("MEOW! 🐾", player.x - cameraX + 30, player.y);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

function saveGame() {
  localStorage.setItem("WhiskerSave", JSON.stringify({score, gameState}));
  alert("Progress Saved! 💾");
}
</script>
</body>
</html>
