<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisker Bytes Cafe - Sprite Edition</title>
  <style>
    :root {
      --pink: #ffc0cb;
      --brown: #6b3e2e;
      --mochi-blue: #00f2ff;
      --jinx-amber: #ffaa00;
      --luna-silver: #e0e0e0;
      --ginger-orange: #ff9900;
      --soft-bg: #f7d2c4;
    }

    /* Global Layout */
    body {
      background: radial-gradient(circle, #fce4ec, var(--soft-bg));
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      margin: 0;
      transition: background 0.5s ease;
      color: var(--brown);
      overflow-x: hidden;
    }

    body.night-mode {
      background: radial-gradient(circle, #2d1b33, #0f0a1e);
      color: #e0e0e0;
    }

    header {
      background-color: var(--brown);
      color: white;
      padding: 15px;
      text-align: center;
      border-bottom: 5px solid var(--pink);
    }

    section {
      margin: 20px auto;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.9);
      border: 6px solid var(--brown);
      border-radius: 40px;
      padding: 20px;
      box-shadow: 8px 8px 0px var(--pink);
      position: relative;
    }

    body.night-mode section {
      background: rgba(20, 15, 30, 0.95);
      border-color: #ff00ff;
      box-shadow: 8px 8px 0px #4a004a;
    }

    /* Cat Sprite Styling */
    .cat-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .cat-card { text-align: center; width: 180px; }

    .cat-avatar {
      width: 150px;
      height: 150px;
      margin: 10px auto;
      position: relative;
      cursor: pointer;
    }

    .cat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      animation: breathe 3s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Glow Calibration - Positioning light over your PNG eyes */
    .eyes-glow {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-around;
      z-index: 2;
      pointer-events: none;
    }

    .eye-point {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0.8;
      filter: blur(2px);
    }

    /* Adjusting Eye Position for each cat's height */
    .mochi .eyes-glow { top: 38%; padding: 0 35px; }
    .jinx .eyes-glow { top: 28%; padding: 0 42px; }
    .luna .eyes-glow { top: 45%; padding: 0 30px; }
    .gingerella .eyes-glow { top: 42%; padding: 0 35px; }

    .mochi .eye-point { background: var(--mochi-blue); box-shadow: 0 0 15px var(--mochi-blue); }
    .jinx .eye-point { background: var(--jinx-amber); box-shadow: 0 0 15px var(--jinx-amber); }
    .luna .eye-point { background: white; box-shadow: 0 0 10px white; }
    .gingerella .eye-point { background: var(--ginger-orange); box-shadow: 0 0 15px var(--ginger-orange); }

    /* UI & Game Controls */
    .mood-container { width: 100px; height: 8px; background: #ddd; border-radius: 4px; margin: 10px auto; overflow: hidden; }
    .mood-bar { height: 100%; width: 50%; background: linear-gradient(90deg, #00f2ff, #ff00ff); transition: width 0.5s; }

    #toy-tray { position: fixed; left: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 20px; border: 3px solid var(--brown); z-index: 100; }
    .toy { font-size: 2rem; cursor: grab; transition: transform 0.2s; }
    .toy:hover { transform: scale(1.3); }

    button { padding: 8px 15px; border-radius: 20px; border: none; background: var(--brown); color: white; cursor: pointer; font-family: inherit; margin: 5px; }
    
    /* Overlay Styles */
    #welcome-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.7); z-index: 200; display: flex; 
      justify-content: center; align-items: center; text-align: center;
    }
    .modal { background: white; padding: 30px; border-radius: 30px; max-width: 400px; border: 5px solid var(--pink); }

    .hidden { opacity: 0 !important; pointer-events: none !important; }
  </style>
</head>
<body>

  <div id="welcome-overlay">
    <div class="modal">
      <h2>Welcome to Whisker Bytes!</h2>
      <p>Drag toys from the left to play with the cats. Watch them glow as they get happier!</p>
      <button onclick="closeWelcome()">Let's Play!</button>
    </div>
  </div>

  <header>
    <h1>Whisker Bytes Cafe</h1>
    <button onclick="toggleNightMode()">🌙 Night Mode</button>
    <button id="photo-btn" onclick="togglePhotoMode()">📸 Photo Mode</button>
  </header>

  <div id="toy-tray">
    <div class="toy" id="laser" draggable="true">🔴</div>
    <div class="toy" id="fish" draggable="true">🐟</div>
    <div class="toy" id="feather" draggable="true">🪶</div>
  </div>

  <section id="main-lounge">
    <div class="cat-grid">
      <div class="cat-card mochi">
        <div class="cat-avatar" onclick="interact('mochi')">
          <img src="mochi_idle.png" alt="Mochi" onerror="this.src='https://via.placeholder.com/150?text=Mochi'">
          <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
        </div>
        <strong>Mochi</strong>
        <div class="mood-container"><div class="mood-bar" id="mochi-bar"></div></div>
      </div>

      <div class="cat-card jinx">
        <div class="cat-avatar" onclick="interact('jinx')">
          <img src="jinx_idle.png" alt="Jinx" onerror="this.src='https://via.placeholder.com/150?text=Jinx'">
          <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
        </div>
        <strong>Jinx</strong>
        <div class="mood-container"><div class="mood-bar" id="jinx-bar"></div></div>
      </div>

      <div class="cat-card luna">
        <div class="cat-avatar" onclick="interact('luna')">
          <img src="luna_idle.png" alt="Luna" onerror="this.src='https://via.placeholder.com/150?text=Luna'">
          <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
        </div>
        <strong>Luna</strong>
        <div class="mood-container"><div class="mood-bar" id="luna-bar"></div></div>
      </div>

      <div class="cat-card gingerella">
        <div class="cat-avatar" onclick="interact('gingerella')">
          <img src="gingerella_idle.png" alt="Gingerella" onerror="this.src='https://via.placeholder.com/150?text=Gingerella'">
          <div class="eyes-glow"><div class="eye-point"></div><div class="eye-point"></div></div>
        </div>
        <strong>Gingerella</strong>
        <div class="mood-container"><div class="mood-bar" id="gingerella-bar"></div></div>
      </div>
    </div>
    <p id="game-status" style="text-align: center; margin-top: 20px;">Welcome to the cafe!</p>
  </section>

  <script>
    let moods = { mochi: 50, jinx: 50, luna: 50, gingerella: 50 };

    function closeWelcome() {
      document.getElementById('welcome-overlay').style.display = 'none';
    }

    function toggleNightMode() {
      document.body.classList.toggle('night-mode');
    }

    function interact(cat) {
      moods[cat] = Math.min(moods[cat] + 10, 100);
      document.getElementById(`${cat}-bar`).style.width = moods[cat] + "%";
      document.getElementById('game-status').innerText = `${cat.toUpperCase()} is purring!`;
      
      const img = document.querySelector(`.${cat} img`);
      
      // Squash & Stretch Animation Logic
      img.animate([
        { transform: 'scale(1, 1)' },
        { transform: 'scale(1.1, 0.9)' },
        { transform: 'scale(0.9, 1.1)' },
        { transform: 'scale(1, 1)' }
      ], { duration: 400, easing: 'ease-in-out' });

      // Enhance Glow
      const glow = document.querySelector(`.${cat} .eyes-glow`);
      glow.style.filter = `brightness(1.8) drop-shadow(0 0 ${moods[cat]/4}px white)`;
      setTimeout(() => glow.style.filter = 'none', 1000);
    }

    // Drag and Drop
    document.querySelectorAll('.toy').forEach(toy => {
      toy.addEventListener('dragstart', (e) => e.dataTransfer.setData("toy", e.target.id));
    });

    document.querySelectorAll('.cat-avatar').forEach(avatar => {
      avatar.addEventListener('dragover', (e) => e.preventDefault());
      avatar.addEventListener('drop', (e) => {
        e.preventDefault();
        const catClass = e.target.closest('.cat-card').classList[1];
        interact(catClass);
      });
    });

    function togglePhotoMode() {
      const ui = ['#toy-tray', 'header', '.mood-container', '#game-status'];
      ui.forEach(selector => document.querySelectorAll(selector).forEach(el => el.classList.toggle('hidden')));
      const btn = document.getElementById('photo-btn');
      btn.innerText = btn.innerText.includes("Photo") ? "📸 Exit" : "📸 Photo Mode";
    }
  </script>
</body>
</html>
