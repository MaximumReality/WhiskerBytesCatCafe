<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisker Bytes: Endless Cafe</title>
  <style>
    :root {
      --dark-wood: #4a2c2a;
      --shelf-accent: rgba(255, 255, 255, 0.2);
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; position: fixed;
    }

    /* THE WORLD CONTAINER */
    #world {
      position: absolute;
      width: 100%; height: 100%;
      background-color: #f7d2c4;
    }

    /* SCROLLING BACKGROUND */
    #scrolling-bg {
      position: absolute;
      width: 200%; height: 100%;
      background-image: url('IMG_2480.jpeg');
      background-repeat: repeat-x;
      background-size: contain;
      z-index: 1;
    }

    /* ENDLESS FLOOR */
    #floor-wrap {
      position: absolute;
      bottom: 0; width: 200%; height: 18%;
      background: #fff; border-top: 6px solid var(--dark-wood);
      display: flex; z-index: 100;
    }

    .tile { flex: 0 0 5%; height: 100%; background-size: cover; }
    .tile:nth-child(odd) { background-image: url('tile1.png'); }
    .tile:nth-child(even) { background-image: url('tile2.png'); }

    /* HONEYCOMB SHELVES */
    .honeycomb {
      position: absolute;
      width: 100px; height: 86px;
      background-color: var(--dark-wood);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      z-index: 50;
      transition: transform 0.2s;
    }

    .cat {
      position: absolute;
      width: 80px; height: 80px;
      z-index: 150;
      transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .cat img { width: 100%; height: 100%; object-fit: contain; }

    #ui {
      position: fixed; bottom: 22%; width: 100%;
      display: flex; justify-content: center; gap: 15px; z-index: 1000;
    }
    button {
      padding: 12px; border-radius: 50%; border: 2px solid var(--dark-wood);
      background: white; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="world">
    <div id="scrolling-bg"></div>
    
    <div id="item-layer">
      <div class="honeycomb" style="top: 20%; left: 10%;" onclick="pounce(10, 20)"></div>
      <div class="honeycomb" style="top: 45%; left: 60%;" onclick="pounce(60, 45)"></div>
      <div class="honeycomb" style="top: 25%; left: 110%;" onclick="pounce(110, 25)"></div>
      <div class="honeycomb" style="top: 50%; left: 160%;" onclick="pounce(160, 50)"></div>
    </div>

    <div id="active-cat" class="cat" style="left: 50%; top: 75%; transform: translateX(-50%);">
      <img src="mochi_idle.png" id="cat-img">
    </div>

    <div id="floor-wrap"></div>
  </div>

  <div id="ui">
    <button onclick="scrollWorld(-10)">⬅️</button>
    <button onclick="pounce(50, 75)">🐾</button>
    <button onclick="scrollWorld(10)">➡️</button>
  </div>

  <script>
    let currentX = 0;
    const bg = document.getElementById('scrolling-bg');
    const floor = document.getElementById('floor-wrap');
    const items = document.getElementById('item-layer');

    // Build Tiles
    for(let i=0; i<40; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      floor.appendChild(t);
    }

    function scrollWorld(amount) {
      currentX += amount;
      
      // The Loop Logic: reset at 100% of viewport width
      if (currentX > 100) currentX = 0;
      if (currentX < 0) currentX = 100;

      // Move the world layers at different speeds (Parallax)
      bg.style.transform = `translateX(-${currentX * 0.5}%)`;
      floor.style.transform = `translateX(-${currentX}%)`;
      items.style.transform = `translateX(-${currentX}vw)`;
    }

    function pounce(x, y) {
      const cat = document.getElementById('active-cat');
      cat.style.top = (y - 5) + "%";
      // This makes the cat stay in place relative to the screen 
      // while the world moves around it!
    }
  </script>
</body>
</html>
