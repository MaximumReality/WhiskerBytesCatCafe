<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Cafe Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center; padding: 20px; }
  #logo-img { width: 150px; margin-bottom: 10px; border-radius: 10px; border: 2px solid var(--pink); }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; font-size: 12px; }
  .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; object-fit: contain; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 13px; }
  #home-btn { position: fixed; top: 10px; right: 10px; z-index: 101; display: none; background: var(--pink); border: 2px solid white; border-radius: 5px; padding: 5px 10px; font-weight: bold; }
  
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 5px; z-index: 500; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 20px; touch-action: manipulation; box-shadow: 0 4px #888; }
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" id="logo-img">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('luna')"><img src="luna_idle.png">LUNA</div>
    <div class="btn-select" onclick="startGame('jinx')"><img src="jinx_idle.png">JINX</div>
    <div class="btn-select" onclick="startGame('gingerella')"><img src="gingerella_idle.png">GINGER</div>
  </div>
</div>

<button id="home-btn" onclick="returnHome()">🏠 HOME</button>

<div id="stats">
    <b>RESOURCES: <span id="scoreVal">0</span></b><br>
    <span id="holdingTxt">Holding: Nothing</span>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
  <button class="ctrl-btn" style="background:var(--pink); width: 80px;" onclick="interact()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, gameState = "START", playerHolding = null;
const catImg = new Image();
const bgPattern = new Image();
const friendImages = [new Image(), new Image()];
friendImages[0].src = 'friend1.png'; friendImages[1].src = 'friend2.png';

const player = { x: 0, y: 0, speed: 5, facing: 1, naturalDir: 1, meowing: 0 };
let furniture = [], customers = [];
const menu = ["☕", "🍪"];

function startGame(cat) {
  catImg.src = cat + "_idle.png";
  bgPattern.src = 'IMG_2480.jpeg'; 
  
  // FIX: Mochi faces Right (1), everyone else faces Left (-1)
  player.naturalDir = (cat === 'mochi') ? 1 : -1;
  player.facing = player.naturalDir; 

  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  document.getElementById('home-btn').style.display = 'block';
  gameState = "PLAYING";
  
  furniture = [
    { x: 80, y: 150, type: "COUNTER", emoji: "🏪", item: "☕" },
    { x: 160, y: 150, type: "COUNTER", emoji: "🏪", item: "🍪" },
    { x: canvas.width/2, y: canvas.height/2 + 50, type: "TABLE", emoji: "🟫", solid: true },
    { x: canvas.width/2 - 70, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑" }, 
    { x: canvas.width/2 + 70, y: canvas.height/2 + 50, type: "CHAIR", emoji: "🪑" }
  ];
  if(customers.length === 0) spawnCustomer();
}

function returnHome() {
    gameState = "START";
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.getElementById('home-btn').style.display = 'none';
}

function spawnCustomer() {
  const openChairs = furniture.filter(f => f.type === "CHAIR" && !f.occupied);
  if (openChairs.length > 0) {
    const chair = openChairs[Math.floor(Math.random() * openChairs.length)];
    chair.occupied = true;
    customers.push({ 
        x: chair.x, y: chair.y - 15, chair: chair, 
        img: friendImages[Math.floor(Math.random() * friendImages.length)],
        order: menu[Math.floor(Math.random() * menu.length)]
    });
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  player.x = canvas.width / 2;
  player.y = canvas.height - 150;
}
window.addEventListener("resize", resize); resize();

const keys = { up: false, down: false, left: false, right: false };
function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => { 
    e.preventDefault(); keys[k] = true; 
    if (k === 'left') player.facing = -1;
    if (k === 'right') player.facing = 1;
  };
  btn.ontouchend = () => { keys[k] = false; };
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

function interact() {
  player.meowing = 30;
  furniture.forEach(f => {
    if(f.type === "COUNTER" && Math.abs(player.x - f.x) < 60 && Math.abs(player.y - f.y) < 60) {
      playerHolding = f.item;
      document.getElementById('holdingTxt').innerText = "Holding: " + playerHolding;
    }
  });
  customers.forEach((c, i) => {
    if(Math.abs(player.x - c.x) < 70 && Math.abs(player.y - c.y) < 70 && playerHolding === c.order) {
        score += 50; playerHolding = null;
        document.getElementById('holdingTxt').innerText = "Holding: Nothing";
        document.getElementById('scoreVal').innerText = score;
        c.chair.occupied = false; customers.splice(i, 1);
        setTimeout(spawnCustomer, 3000);
    }
  });
}

function update() {
  if (gameState !== "PLAYING") return;
  let nextX = player.x, nextY = player.y;
  if (keys.up) nextY -= player.speed;
  if (keys.down) nextY += player.speed;
  if (keys.left) nextX -= player.speed;
  if (keys.right) nextX += player.speed;
  
  let canMove = true;
  furniture.forEach(f => { if(f.solid && Math.abs(nextX - f.x) < 50 && Math.abs(nextY - f.y) < 50) canMove = false; });
  if(canMove) { player.x = nextX; player.y = nextY; }
  player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
  player.y = Math.max(120, Math.min(canvas.height - 110, player.y));
}

function draw() {
  ctx.fillStyle = "#d2b48c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(0,0,0,0.05)";
  for(let j=0; j<canvas.height; j+=40) { ctx.strokeRect(0, j, canvas.width, 1); }
  ctx.drawImage(bgPattern, 0, 0, canvas.width, 90);

  ctx.font = "40px Arial";
  furniture.forEach(f => {
      ctx.fillText(f.emoji, f.x - 20, f.y + 15);
      if(f.type === "COUNTER") { ctx.font = "14px Arial"; ctx.fillText(f.item, f.x - 10, f.y - 25); ctx.font = "40px Arial"; }
  });

  customers.forEach(c => {
    ctx.drawImage(c.img, c.x - 45, c.y - 45, 90, 90);
    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x + 35, c.y - 35, 18, 0, Math.PI * 2); ctx.fill();
    ctx.stroke(); ctx.fillStyle = "black"; ctx.font = "16px Arial"; ctx.fillText(c.order, c.x + 27, c.y - 30);
  });

  ctx.save();
  ctx.translate(player.x, player.y);
  // FLIP LOGIC: If facing opposite of natural direction, flip the sprite
  if (player.facing !== player.naturalDir) ctx.scale(-1, 1);
  ctx.drawImage(catImg, -45, -45, 90, 90);
  ctx.restore();

  if(player.meowing > 0) {
    ctx.font = "bold 14px Arial"; ctx.fillStyle = "white";
    ctx.fillText("MEOW! 🐾", player.x - 30, player.y - 55);
    player.meowing--;
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
