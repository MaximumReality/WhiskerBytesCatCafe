<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --wood: #8b5a2b; --floor: #d2b48c; --pink: #ffc0cb; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f7d2c4; font-family: 'Courier New', monospace; width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }
  
  #overlay { position: fixed; inset: 0; background: rgba(74, 44, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center; }
  #logo-img { width: 180px; margin-bottom: 20px; border-radius: 10px; border: 2px solid var(--pink); }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn-select { background: white; border: 3px solid var(--pink); border-radius: 15px; padding: 10px; color: #4a2c2a; font-weight: bold; }
  .btn-select img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; }

  #stats { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; border: 2px solid var(--wood); font-size: 14px; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 500; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--wood); background: white; font-size: 24px; touch-action: manipulation; box-shadow: 0 4px #888; }
</style>
</head>
<body>

<div id="overlay">
  <img src="whiskerbytes.png" id="logo-img">
  <div class="char-grid">
    <div class="btn-select" onclick="startGame('mochi')"><img src="mochi_idle.png">MOCHI</div>
    <div class="btn-select" onclick="startGame('luna')"><img src="luna_idle.png">LUNA</div>
  </div>
</div>

<div id="stats"><b>RESOURCES: <span id="scoreVal">0</span></b></div>

<canvas id="game"></canvas>

<div id="controls">
  <div class="d-pad">
    <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
  <button class="ctrl-btn" style="background:var(--pink); width: 80px;" onclick="meow()">📢</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let score = 0, gameState = "START";
const catImg = new Image();
const bgPattern = new Image();

const player = { x: 0, y: 0, speed: 5, isFlipped: false, meowing: 0 };
let furniture = [];
let customers = [];
const customerEmojis = ["🚶", "🚶🏻‍♂️", "🚶🏾‍♀️‍➡️", "🚶🏼‍➡️"];

function startGame(cat) {
  catImg.src = cat + "_idle.png";
  bgPattern.src = 'IMG_2480.jpeg'; 
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats').style.display = 'block';
  gameState = "PLAYING";
  
  // Arrange furniture so it's not overlapping
  furniture = [
    { x: 250, y: 250, type: "TABLE", emoji: "🟫", solid: true },
    { x: 190, y: 250, type: "CHAIR", emoji: "🪑", solid: false }, 
    { x: 310, y: 250, type: "CHAIR", emoji: "🪑", solid: false }
  ];
  spawnCustomer();
}

function spawnCustomer() {
  const openChairs = furniture.filter(f => f.type === "CHAIR" && !f.occupied);
  if (openChairs.length > 0) {
    const chair = openChairs[Math.floor(Math.random() * openChairs.length)];
    chair.occupied = true;
    // Standing next to the chair
    customers.push({ 
      x: chair.x, 
      y: chair.y - 15, 
      chair: chair, 
      emoji: customerEmojis[Math.floor(Math.random() * customerEmojis.length)] 
    });
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
}
window.addEventListener("resize", resize); resize();

const keys = { up: false, down: false, left: false, right: false };
function bind(id, k) {
  const btn = document.getElementById(id);
  btn.ontouchstart = (e) => { 
    e.preventDefault(); 
    keys[k] = true; 
    if (k === 'left') player.isFlipped = true;
    if (k === 'right') player.isFlipped = false;
  };
  btn.ontouchend = () => { keys[k] = false; };
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

function meow() {
  player.meowing = 30;
  customers.forEach((c, i) => {
    if(Math.abs(player.x - c.x) < 60 && Math.abs(player.y - c.y) < 60) {
      score += 10;
      document.getElementById('scoreVal').innerText = score;
      c.chair.occupied = false;
      customers.splice(i, 1);
      setTimeout(spawnCustomer, 3000);
    }
  });
}

function update() {
  if (gameState !== "PLAYING") return;
  
  let nextX = player.x;
  let nextY = player.y;

  if (keys.up) nextY -= player.speed;
  if (keys.down) nextY += player.speed;
  if (keys.left) nextX -= player.speed;
  if (keys.right) nextX += player.speed;
  
  // Basic Table Collision
  let canMove = true;
  furniture.forEach(f => {
    if(f.solid && Math.abs(nextX - f.x) < 40 && Math.abs(nextY - f.y) < 40) {
      canMove = false;
    }
  });

  if(canMove) {
    player.x = nextX;
    player.y = nextY;
  }

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(120, Math.min(canvas.height - 110, player.y));
}

function draw() {
  ctx.fillStyle = "#d2b48c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Floor planks
  ctx.strokeStyle = "rgba(0,0,0,0.05)";
  for(let j=0; j<canvas.height; j+=40) { ctx.strokeRect(0, j, canvas.width, 1); }

  // Wallpaper Border
  ctx.drawImage(bgPattern, 0, 0, canvas.width, 90);

  // Furniture
  ctx.font = "40px Arial";
  furniture.forEach(f => ctx.fillText(f.emoji, f.x - 20, f.y + 10));

  // CUSTOMERS (Standing)
  customers.forEach(c => ctx.fillText(c.emoji, c.x - 20, c.y + 10));

  // CAT
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.isFlipped) ctx.scale(-1, 1);
  ctx.drawImage(catImg, -40, -40, 80, 80);
  ctx.restore();

  if(player.meowing > 0) {
    ctx.font = "bold 16px Arial"; ctx.fillStyle = "white";
    ctx.fillText("MEOW! 🐾", player.x - 30, player.y - 50);
    player.meowing--;
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
