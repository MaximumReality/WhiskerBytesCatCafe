<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisker Bytes: Sushi Lounge</title>
  <style>
    :root {
      --dark-wood: #4a2c2a;
      --floor-height: 120px;
      --ui-height: 80px;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; position: fixed;
      background-color: #f7d2c4;
    }

    /* THE WORLD SCROLLER */
    #scroller {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: calc(100% - var(--ui-height));
      will-change: transform;
    }

    #bg-layer {
      position: absolute;
      width: 400%; height: 100%;
      background: url('IMG_2480.jpeg') repeat-x;
      background-size: contain;
    }

    /* HONEYCOMB SHELVES */
    .honeycomb {
      position: absolute;
      width: 100px; height: 86px;
      background-color: var(--dark-wood);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }

    /* THE FLOOR & SUSHI BELT */
    #floor-layer {
      position: absolute;
      bottom: 0; 
      width: 400%; 
      height: var(--floor-height);
      background: #fff;
      border-top: 6px solid var(--dark-wood);
      display: flex; /* Forces tiles to stay in a flat row */
    }

    .tile {
      flex: 0 0 100px; /* Each tile is exactly 100px wide, no stacking */
      height: 100%;
      background-size: cover;
    }
    .tile:nth-child(odd) { background-image: url('tile1.png'); }
    .tile:nth-child(even) { background-image: url('tile2.png'); }

    /* SUSHI: Positioned exactly on top of the floor */
    .treat {
      position: absolute;
      bottom: calc(var(--floor-height) + 5px);
      font-size: 35px;
      z-index: 110;
    }

    /* THE CAT: Centered and sitting on the floor */
    .cat {
      position: fixed;
      left: 50%;
      bottom: calc(var(--ui-height) + var(--floor-height) - 20px);
      width: 90px; height: 90px;
      transform: translateX(-50%);
      transition: bottom 0.5s ease-out;
      z-index: 200;
    }
    .cat img { width: 100%; height: 100%; object-fit: contain; }

    /* UI: MOVED BELOW THE FLOOR */
    #ui-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: var(--ui-height);
      background: var(--dark-wood);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 500;
    }

    button {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background: white;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div id="scroller">
    <div id="bg-layer"></div>
    
    <div id="world-content">
      <div class="honeycomb" style="top: 20%; left: 300px;"></div>
      <div class="honeycomb" style="top: 40%; left: 800px;"></div>
      
      <div class="treat" style="left: 150px;">🍣</div>
      <div class="treat" style="left: 450px;">🍤</div>
      <div class="treat" style="left: 750px;">🍙</div>
      <div class="treat" style="left: 1050px;">🍣</div>
    </div>

    <div id="floor-layer">
      </div>
  </div>

  <div class="cat" id="player-cat">
    <img src="mochi_idle.png" id="current-cat">
  </div>

  <div id="ui-bar">
    <button onclick="moveWorld(-100)">⬅️</button>
    <button onclick="jump()">🚀</button>
    <button onclick="moveWorld(100)">➡️</button>
    <button onclick="swap()">🔄</button>
  </div>

  <script>
    let currentPos = 0;
    const scroller = document.getElementById('scroller');
    const floor = document.getElementById('floor-layer');

    // Create 40 tiles in a flat row
    for(let i=0; i<40; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      floor.appendChild(t);
    }

    function moveWorld(delta) {
      currentPos += delta;
      // Loop after 2000px of scrolling
      if (currentPos > 2000) currentPos = 0;
      if (currentPos < 0) currentPos = 2000;
      
      scroller.style.transform = `translateX(-${currentPos}px)`;
    }

    function jump() {
      const cat = document.getElementById('player-cat');
      const ground = 180; // Total height of UI + Floor
      cat.style.bottom = (ground + 150) + "px";
      setTimeout(() => {
        cat.style.bottom = (ground - 20) + "px";
      }, 500);
    }

    let isMochi = true;
    function swap() {
      isMochi = !isMochi;
      document.getElementById('current-cat').src = isMochi ? "mochi_idle.png" : "jinx_idle.png";
    }
  </script>
</body>
</html>
