<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHISKER BYTES: Cyber Cafe V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    :root { --wood: #5d4037; --floor: #d2b48c; --pink: #ffc0cb; --cyan: #0ff; }
    body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
    canvas { display: block; background: #1a1a1a; width: 100vw; height: 100vh; mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); }
    
    #stats { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: var(--cyan); padding: 12px; border-radius: 8px; border: 1px solid var(--cyan); z-index: 100; font-size: 14px; }
    #day-over { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; color: #f0f; padding: 30px; border: 2px solid var(--cyan); border-radius: 20px; z-index: 8000; display: none; text-align: center; }
    
    #controls { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px; z-index: 1000; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--cyan); background: rgba(0,0,0,0.5); color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

    <div onpointerdown="window.location.href='cyber.html'" class="btn-select" style="border-color: #0ff;">
    <img src="azul_idle.png">azul (v2)
</div>


<div id="stats">
    [SCORE]: <span id="scoreVal">0</span> | [HIGH]: <span id="highVal">0</span><br>
    [TIME]: <span id="timeVal">9:00 am</span> | [TRASH]: <span id="trashVal">0</span>%<br>
    [HOLDING]: <span id="holdingTxt" style="color: #f0f;">empty</span>
</div>

<div id="day-over">
    <h2>SYSTEM SHUTDOWN</h2>
    FINAL SCORE: <span id="finalScore">0</span><br><br>
    <button onclick="location.reload()" style="background:var(--cyan); border:none; padding:10px;">REBOOT</button>
</div>

<canvas id="game"></canvas>

<div id="controls">
    <div class="d-pad">
        <div></div><button class="ctrl-btn" id="up">⬆️</button><div></div>
        <button class="ctrl-btn" id="left">⬅️</button>
        <button class="ctrl-btn" id="down">⬇️</button>
        <button class="ctrl-btn" id="right">➡️</button>
    </div>
    <button class="ctrl-btn" style="width:180px; border-radius: 30px; background:rgba(255,0,255,0.3);" onpointerdown="interact()">📢 MEOW (ACTION)</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let gameActive = true, score = 0, gameMinutes = 540;
let playerHolding = null, trashLevel = 0, tvActive = false, radioActive = false;
let floatingTips = [], musicNotes = [], customers = [];

const keys = { up: false, down: false, left: false, right: false };
const catImg = new Image(), f1 = new Image(), f2 = new Image(), f3 = new Image();

// Asset Sources
f1.src = 'friend1.png'; // Stella
f2.src = 'friend2.png'; // Luna
f3.src = 'critic2.png'; // You
catImg.src = 'mochkil_idle.png'; // Start as the Chef
// Add this near your other image sources
bgImg.src = 'IMG_2480.jpeg'; 

const bgMusic = new Audio('firemansuperhero-with-lowercase-f.mp3'); 
bgMusic.loop = true;

const player = { x: 200, y: 350, speed: 6, cookTime: 30 };

// WIDENED SPACING TO PREVENT WRONG PICKUPS
const midY = 160 + (window.innerHeight - 320) / 2;
const furniture = [
    {x: 50,  y: 200, type: "STATION", item: "☕", e: "☕"},
    {x: 130, y: 200, type: "STATION", item: "🍪", e: "🍪"},
    {x: 210, y: 200, type: "STATION", item: "🍼", e: "🍼"},
    {x: 290, y: 200, type: "STATION", item: "🍲", e: "🍲"},
    {x: 370, y: 200, type: "TRASH", e: "🗑️"},
    {x: 40,  y: 350, type: "RADIO", e: "📻"},
    {x: window.innerWidth - 60, y: 350, type: "TV", e: "📺"},
    {x: window.innerWidth / 2, y: midY, type: "TABLE", e: "🟫"},
    {x: window.innerWidth / 2 - 80, y: midY, type: "CHAIR", e: "🪑", occupied: false},
    {x: window.innerWidth / 2 + 80, y: midY, type: "CHAIR", e: "🪑", occupied: false}
];

function interact() {
    if(!bgMusic.playing) bgMusic.play().catch(()=>{});

    furniture.forEach(f => {
        if (Math.hypot(player.x - f.x, player.y - f.y) < 60) {
            if (f.type === "STATION" && !playerHolding) {
                playerHolding = f.item; // Quick pickup for V2
                player.readyTimer = 20;
            }
            if (f.type === "TRASH") playerHolding = null;
            if (f.type === "TV") tvActive = !tvActive;
            if (f.type === "RADIO") radioActive = !radioActive;
        }
    });

    customers.forEach((c, i) => {
        if (Math.hypot(player.x - c.x, player.y - c.y) < 80 && playerHolding === c.order) {
            let tip = 150; 
            let bonus = (c.isCritic) ? "⭐" : "💖";
            score += tip;
            playerHolding = null; // Hands are now empty!
            c.chair.occupied = false;
            floatingTips.push({x: c.x, y: c.y, text: bonus + " +" + tip, life: 60});
            customers.splice(i, 1);
        }
    });
    document.getElementById('holdingTxt').innerText = playerHolding || "empty";
}
function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    // 1. DRAW WALLPAPER (Top Section)
    if(bgImg.complete) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, 160);
    } else {
        ctx.fillStyle = "#222"; // Fallback if image fails
        ctx.fillRect(0, 0, canvas.width, 160);
    }

    // 2. DRAW CYBER-TILE FLOOR (Bottom Section)
    const ts = 60; // Tile size
    for(let x=0; x<canvas.width; x+=ts) {
        for(let y=160; y<canvas.height; y+=ts) {
            // Alternating neon-tinted wood colors
            ctx.fillStyle = (Math.floor(x/ts) + Math.floor(y/ts)) % 2 === 0 ? "#2d1b10" : "#3d2b1f";
            ctx.fillRect(x, y, ts, ts);
            
            // Add a subtle neon grid line
            ctx.strokeStyle = "rgba(0, 255, 255, 0.05)";
            ctx.strokeRect(x, y, ts, ts);
        }
    }

    // 3. DRAW FURNITURE
    furniture.forEach(f => {
        // Draw a small shadow/base for the stations
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(f.x-30, f.y+10, 60, 10);
        
        ctx.font = "40px Arial";
        ctx.fillText(f.e, f.x-20, f.y+15);
        
        // TV Glow Effect
        if(f.type === "TV" && tvActive) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = "cyan";
            ctx.fillStyle = "rgba(0, 255, 255, 0.2)";
            ctx.fillRect(f.x-25, f.y-25, 50, 50);
            ctx.font = "20px Arial"; 
            ctx.fillText("🎤🐱", f.x-15, f.y+10);
            ctx.shadowBlur = 0;
        }
        
        // Radio Glow Effect
        if(f.type === "RADIO" && radioActive) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "magenta";
            ctx.font = "30px Arial";
            ctx.fillText("📻", f.x-15, f.y+10);
            ctx.shadowBlur = 0;
        }
    });

    // 4. DRAW MUSIC NOTES
    musicNotes.forEach((n, i) => {
        ctx.fillStyle = "#f0f";
        ctx.font = "20px Arial";
        ctx.fillText("🎶", n.x, n.y); 
        n.y--; n.life--;
        if(n.life <= 0) musicNotes.splice(i, 1);
    });

    // 5. DRAW CUSTOMERS (Stella, Luna, & Critic)
    customers.forEach(c => {
        if(c.img.complete) ctx.drawImage(c.img, c.x-30, c.y-30, 60, 60);
        
        // Thought Bubble
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(c.x+25, c.y-35, 18, 0, Math.PI*2);
        ctx.fill();
        ctx.font = "16px Arial"; 
        ctx.fillStyle = "black";
        ctx.fillText(c.order, c.x+17, c.y-30);
        
        // Patience Bar
        ctx.fillStyle = "#333";
        ctx.fillRect(c.x-20, c.y+35, 40, 6);
        ctx.fillStyle = c.patience > 500 ? "lime" : "red";
        ctx.fillRect(c.x-20, c.y+35, (c.patience/1500)*40, 6);
    });

    // 6. DRAW PLAYER
    ctx.drawImage(catImg, player.x-35, player.y-35, 70, 70);
    
    // 7. DRAW FLOATING TIPS
    floatingTips.forEach((t, i) => {
        ctx.fillStyle = "cyan"; 
        ctx.font = "bold 20px monospace";
        ctx.fillText(t.text, t.x, t.y);
        t.y--; t.life--; 
        if(t.life <= 0) floatingTips.splice(i, 1);
    });

    // Update Stats
    document.getElementById('scoreVal').innerText = score;
    let h = Math.floor(gameMinutes/60), m = Math.floor(gameMinutes%60);
    document.getElementById('timeVal').innerText = (h%12||12)+":"+(m<10?'0':'')+m+(h>=12?'pm':'am');
}

function update() {
    if (!gameActive) return;
    
    // Movement
    if (keys.up) player.y -= player.speed; if (keys.down) player.y += player.speed;
    if (keys.left) player.x -= player.speed; if (keys.right) player.x += player.speed;
    
    player.y = Math.max(225, Math.min(canvas.height - 150, player.y));
    player.x = Math.max(40, Math.min(canvas.width - 40, player.x));

    gameMinutes += 0.15;
    if (gameMinutes >= 1260) { gameActive = false; document.getElementById('day-over').style.display='block'; }

    // Spawn Family/Critic
    if (Math.random() < 0.008 && customers.length < 2) {
        let chair = furniture.find(f => f.type === "CHAIR" && !f.occupied);
        if (chair) {
            chair.occupied = true;
            let roll = Math.random();
            let isCritic = roll < 0.33;
            customers.push({
                x: chair.x, y: chair.y, chair,
                order: isCritic ? "🍲" : (roll < 0.66 ? "🍼" : "🍪"),
                img: isCritic ? f3 : (roll < 0.66 ? f1 : f2),
                isCritic: isCritic,
                patience: 1500
            });
        }
    }

    // RADIO & TV BOOST LOGIC
    customers.forEach((c, i) => {
        let drainRate = 1;
        if (tvActive) drainRate -= 0.3;    // TV slows patience drain
        if (radioActive) drainRate -= 0.3; // Radio slows it more
        c.patience -= drainRate;

        if(c.patience <= 0) { c.chair.occupied = false; customers.splice(i, 1); score -= 50; }
    });

    if (radioActive && Math.random() < 0.05) musicNotes.push({x: 60, y: 350, life: 50});
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    // Furniture Draw
    furniture.forEach(f => {
        ctx.font = "40px Arial";
        ctx.fillText(f.e, f.x-20, f.y+15);
        if(f.type === "TV" && tvActive) {
            ctx.fillStyle = "rgba(0, 255, 255, 0.2)";
            ctx.fillRect(f.x-25, f.y-25, 50, 50);
            ctx.font = "20px Arial"; ctx.fillText("🎤🐱", f.x-15, f.y+10);
        }
    });

    musicNotes.forEach((n, i) => {
        ctx.fillText("🎶", n.x, n.y); n.y--; n.life--;
        if(n.life <= 0) musicNotes.splice(i, 1);
    });

    customers.forEach(c => {
        if(c.img.complete) ctx.drawImage(c.img, c.x-30, c.y-30, 60, 60);
        ctx.fillStyle = "white"; ctx.fillText(c.order, c.x-10, c.y-40);
        ctx.fillStyle = "lime"; ctx.fillRect(c.x-20, c.y+35, (c.patience/1500)*40, 5);
    });

    ctx.drawImage(catImg, player.x-35, player.y-35, 70, 70);
    
    floatingTips.forEach((t, i) => {
        ctx.fillStyle = "cyan"; ctx.fillText(t.text, t.x, t.y);
        t.y--; t.life--; if(t.life <= 0) floatingTips.splice(i, 1);
    });

    document.getElementById('scoreVal').innerText = score;
    let h = Math.floor(gameMinutes/60), m = Math.floor(gameMinutes%60);
    document.getElementById('timeVal').innerText = (h%12||12)+":"+(m<10?'0':'')+m+(h>=12?'pm':'am');
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
window.onload = () => {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    ["up","down","left","right"].forEach(id => {
        document.getElementById(id).onpointerdown = () => keys[id] = true;
        document.getElementById(id).onpointerup = () => keys[id] = false;
    });
    loop();
};
</script>
</body>
</html>
